<!doctype html>
<!--
  Feeding tracker (מעקב הנקות)
  ------------------------------------------------------------
  A single, self-contained, offline HTML page for logging breastfeeding sessions.

  - Tap a side dial to start; tap the other dial to switch sides mid-feed.
  - Pause / resume, finish & save (with undo), discard.
  - Suggests which side to start on next (the side opposite to where the last feed started).
  - Rare bottle feeds (volume in ml only).
  - History with manual add / edit / delete.
  - Insights: feeds per day, gaps between feeds, longest stretch, side balance, day-by-day timeline.
  - Solid food: meal diary (foods, amount, liking, reaction note) + "foods tried" collection + allergen progress.
  - A few small surprises ("moments") for the person feeding at 3am.
  - Backup (JSON), spreadsheet export (CSV) and restore.
  - When served over https with manifest + service worker, installs as an app (home screen / lock screen).

  Storage: everything lives in this browser's localStorage on this device. No network, no server.
  Fonts are local files in fonts/ (Rubik, SIL Open Font License), cached by the service worker for offline use.
  There is no build step: this file is edited directly. See CLAUDE.md for the rules of this repo.
-->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151827" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<title>יומן</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='20' cy='32' r='16' fill='%234A68B0'/%3E%3Ccircle cx='44' cy='32' r='16' fill='%23C47F1E'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* =========================================================
 * FONTS — Rubik variable (weights 300–900), local files in fonts/ so the page works offline.
 * Two subsets: Hebrew glyphs, and Latin (digits / punctuation).
 * ========================================================= */
@font-face {
  font-family: 'Rubik Embedded';
  font-style: normal;
  font-weight: 300 900;
  font-display: swap;
  src: url(fonts/rubik-hebrew.woff2) format('woff2');
  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
}
@font-face {
  font-family: 'Rubik Embedded';
  font-style: normal;
  font-weight: 300 900;
  font-display: swap;
  src: url(fonts/rubik-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+2013-2014, U+2018-201D, U+2026, U+2212;
}

/* =========================================================
 * DESIGN TOKENS
 * Light = cool "milk" daylight. Dark = dim night indigo for 3am feeds.
 * Side colors were validated for color-vision deficiency in both modes;
 * a side is never shown by color alone (its name is always written).
 * ========================================================= */
:root {
  --surface-page: #EEF0F6;
  --surface-card: #FFFFFF;
  --surface-sunken: #E3E6EF;
  --ink-strong: #221E36;
  --ink: #3A3651;
  --ink-soft: #66627E;
  --ink-faint: #8F8BA5;
  --line: #D8DBE6;

  --side-right: #C47F1E;           /* ימין — honey amber */
  --side-right-soft: rgba(196, 127, 30, 0.14);
  --side-left: #4A68B0;            /* שמאל — dusk blue */
  --side-left-soft: rgba(74, 104, 176, 0.14);
  --bottle: #3F9A5C;               /* בקבוק — sage green */
  --neutral-mark: #8A86A3;         /* single-series charts (not tied to a side) */
  --night-band: rgba(74, 104, 176, 0.08);

  --primary-fill: #352C5E;
  --primary-ink: #FFFFFF;
  --danger: #B3362F;
  --danger-soft: rgba(179, 54, 47, 0.1);
  --focus-ring: #4A68B0;
  --scrim: rgba(20, 18, 40, 0.42);
  --toast-fill: #221E36;
  --toast-ink: #F2F1F8;
  --heart: #D9577A;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface-page: #151827;
    --surface-card: #1F2439;
    --surface-sunken: #1A1E31;
    --ink-strong: #E2DFEF;
    --ink: #C8C4DA;
    --ink-soft: #9792AF;
    --ink-faint: #6F6B88;
    --line: #2D3250;

    --side-right: #C4862F;
    --side-right-soft: rgba(196, 134, 47, 0.17);
    --side-left: #6A88D6;
    --side-left-soft: rgba(106, 136, 214, 0.17);
    --bottle: #3E9C70;
    --neutral-mark: #7C7898;
    --night-band: rgba(106, 136, 214, 0.09);

    --primary-fill: #A79DE0;
    --primary-ink: #151827;
    --danger: #E37A70;
    --danger-soft: rgba(227, 122, 112, 0.12);
    --focus-ring: #A79DE0;
    --scrim: rgba(5, 6, 14, 0.6);
    --toast-fill: #E2DFEF;
    --toast-ink: #151827;
    --heart: #E7809A;
  }
}

/* =========================================================
 * BASE
 * ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--surface-page);
  color: var(--ink);
  font-family: 'Rubik Embedded', system-ui, 'Segoe UI', Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
[hidden] { display: none !important; }
.numeric { font-variant-numeric: tabular-nums; unicode-bidi: isolate; }

.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 20px calc(96px + env(safe-area-inset-bottom));
  min-height: 100dvh;
}

/* ---------- header ---------- */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(12px + env(safe-area-inset-top)) 0 4px;
}
.app-title { margin: 0; font-size: 19px; font-weight: 600; color: var(--ink-strong); }
.icon-button {
  position: relative;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-soft);
}
.icon-button svg { width: 24px; height: 24px; }
.icon-button .attention-dot {
  position: absolute; top: 9px; inset-inline-start: 9px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--side-right);
}

.storage-notice {
  margin: 8px 0 0;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--danger-soft);
  color: var(--danger);
  font-size: 14px;
}

/* =========================================================
 * HOME — last feed
 * ========================================================= */
.last-feed { margin-top: 26px; }
.last-feed__lead { margin: 0; color: var(--ink-soft); font-size: 16px; }
.last-feed__value {
  margin: 2px 0 0;
  display: flex; align-items: baseline; gap: 10px;
  color: var(--ink-strong);
}
.last-feed__number {
  font-size: clamp(64px, 21vw, 92px);
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.last-feed__unit { font-size: 22px; font-weight: 400; color: var(--ink); }
.last-feed__detail { margin: 10px 0 0; font-size: 16px; color: var(--ink); }
.day-lines { margin: 14px 0 0; padding: 0; list-style: none; color: var(--ink-soft); font-size: 15px; }
.empty-hint { margin: 8px 0 0; color: var(--ink-soft); max-width: 32ch; }

.suggestion {
  margin: 30px 0 0;
  font-size: 17px;
  color: var(--ink);
}
.suggestion strong { color: var(--ink-strong); font-weight: 600; }

/* =========================================================
 * DIALS — the two side buttons (the app's central control)
 * DOM order is right, then left; with dir="rtl" the right side lands on the right of the screen.
 * ========================================================= */
.dials {
  display: flex;
  gap: 16px;
  justify-content: space-between;
  margin-top: 16px;
}
.dial {
  --side-color: var(--side-right);
  --side-soft: var(--side-right-soft);
  position: relative;
  flex: 1 1 0;
  max-width: 200px;
  aspect-ratio: 1;
  border: 0;
  border-radius: 50%;
  background: var(--surface-card);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  padding: 0;
  transition: transform 0.12s ease, background-color 0.2s ease;
  touch-action: manipulation;
}
.dial[data-side="L"] { --side-color: var(--side-left); --side-soft: var(--side-left-soft); }
.dial:active { transform: scale(0.97); }
.dial__ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
.dial__track { fill: none; stroke: var(--line); stroke-width: 2.5; }
.dial__sweep { fill: none; stroke: var(--side-color); stroke-width: 5; stroke-linecap: round; }
.dial__name { position: relative; font-size: 30px; font-weight: 600; color: var(--ink-strong); line-height: 1.15; }
.dial__time { position: relative; font-size: 20px; font-weight: 400; color: var(--ink-strong); font-variant-numeric: tabular-nums; }
.dial__sub { position: relative; font-size: 14px; color: var(--ink-soft); }

/* suggested side (home): tinted fill and a full colored ring */
.dial.is-suggested { background: var(--side-soft); }
.dial.is-suggested .dial__track { stroke: var(--side-color); stroke-width: 5; }
.dial.is-suggested .dial__sub { color: var(--ink); font-weight: 500; }
/* running side (active feed): tinted fill and a sweeping second hand */
.dial.is-running { background: var(--side-soft); }
.dial.is-running .dial__track { stroke: var(--side-soft); stroke-width: 5; }
/* idle side during a feed */
.dial.is-waiting .dial__name { color: var(--ink-soft); }

/* =========================================================
 * HOME — quick actions
 * ========================================================= */
.quick-actions { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
.pill-button {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-size: 15px;
}
.pill-button svg { width: 18px; height: 18px; color: var(--ink-soft); }

/* =========================================================
 * ACTIVE FEED
 * ========================================================= */
.active-feed { margin-top: 26px; }
.active-feed__lead { margin: 0; color: var(--ink-soft); font-size: 16px; }
.active-feed__timer {
  margin: 2px 0 0;
  font-size: clamp(72px, 24vw, 100px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink-strong);
  font-variant-numeric: tabular-nums;
}
.active-feed__timer.is-paused { color: var(--ink-faint); }
.active-feed__state { margin: 8px 0 0; color: var(--ink-soft); min-height: 1.5em; }
.long-feed-note { margin: 14px 0 0; font-size: 14px; color: var(--ink-soft); max-width: 36ch; }

.controls { display: grid; grid-template-columns: 1fr 1.5fr; gap: 12px; margin-top: 26px; }
.button {
  min-height: 56px;
  padding: 0 18px;
  border: 0;
  border-radius: 18px;
  font-size: 17px;
  font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.button--primary { background: var(--primary-fill); color: var(--primary-ink); }
.button--secondary { background: var(--surface-card); color: var(--ink-strong); }
.button--block { width: 100%; }
.text-button {
  display: block;
  margin: 14px auto 0;
  padding: 10px 12px;
  border: 0; background: transparent;
  color: var(--ink-soft);
  font-size: 15px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.text-button--danger { color: var(--danger); }

/* =========================================================
 * HISTORY
 * ========================================================= */
.screen-title { margin: 22px 0 0; font-size: 26px; font-weight: 600; color: var(--ink-strong); }
.history-day { margin-top: 24px; }
.history-day__head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
.history-day__title { margin: 0; font-size: 17px; font-weight: 600; color: var(--ink-strong); }
.history-day__summary { margin: 0; font-size: 14px; color: var(--ink-soft); text-align: end; }
.history-entry {
  width: 100%;
  display: grid;
  grid-template-columns: 54px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 2px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: start;
}
.history-entry__time { font-size: 18px; font-weight: 500; color: var(--ink-strong); font-variant-numeric: tabular-nums; }
.history-entry__what { font-size: 15px; color: var(--ink); }
.history-entry__gap { display: block; font-size: 13px; color: var(--ink-faint); }
.history-entry__total { font-size: 15px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.split-bar { display: flex; gap: 2px; height: 6px; margin-top: 6px; max-width: 100%; }
.split-bar span { border-radius: 3px; min-width: 3px; }
.mark-right { background: var(--side-right); }
.mark-left { background: var(--side-left); }
.mark-bottle { background: var(--bottle); }
.bottle-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--bottle); margin-inline-end: 6px; vertical-align: 1px; }
.more-history { margin-top: 18px; }
.empty-state { margin-top: 40px; color: var(--ink-soft); max-width: 34ch; }
.empty-state strong { display: block; color: var(--ink-strong); font-size: 18px; font-weight: 600; margin-bottom: 4px; }

/* =========================================================
 * INSIGHTS
 * ========================================================= */
.range-switch {
  display: inline-flex;
  margin-top: 16px;
  padding: 4px;
  border-radius: 999px;
  background: var(--surface-sunken);
}
.range-switch button {
  min-height: 38px;
  padding: 0 16px;
  border: 0; border-radius: 999px;
  background: transparent;
  color: var(--ink-soft);
  font-size: 15px;
}
.range-switch button[aria-pressed="true"] { background: var(--surface-card); color: var(--ink-strong); font-weight: 600; }

.summary-list { margin: 22px 0 0; }
.summary-row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.summary-row dt { color: var(--ink-soft); font-size: 15px; }
.summary-row dd { margin: 0; color: var(--ink-strong); font-size: 17px; font-weight: 600; text-align: end; font-variant-numeric: tabular-nums; }
.summary-row dd small { display: block; font-size: 13px; font-weight: 400; color: var(--ink-soft); }

.chart-section { margin-top: 34px; }
.chart-section h2 { margin: 0; font-size: 18px; font-weight: 600; color: var(--ink-strong); }
.chart-note { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); max-width: 40ch; }
.chart { margin-top: 12px; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: inherit; fill: var(--ink-faint); font-size: 11px; }
.chart .label-strong { fill: var(--ink-soft); }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .night-band { fill: var(--night-band); }
.chart .fill-right { fill: var(--side-right); }
.chart .fill-left { fill: var(--side-left); }
.chart .fill-bottle { fill: var(--bottle); stroke: var(--surface-page); stroke-width: 2; }
.chart .fill-neutral { fill: var(--neutral-mark); }
.chart .is-partial { opacity: 0.45; }
.chart .hit-area { fill: transparent; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-soft); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend .swatch { width: 12px; height: 8px; border-radius: 2px; display: inline-block; }
.legend .swatch-night { background: var(--night-band); outline: 1px solid var(--line); }
.legend .swatch-bottle { width: 9px; height: 9px; border-radius: 50%; }

.balance { margin-top: 12px; }
.balance__bar { display: flex; gap: 2px; height: 14px; }
.balance__bar span { border-radius: 4px; min-width: 4px; }
.balance__labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 15px; color: var(--ink); }
.balance__labels small { display: block; color: var(--ink-soft); font-size: 13px; }
.balance__labels > div:last-child { text-align: end; }

.chart-tooltip {
  position: fixed;
  z-index: 30;
  max-width: 220px;
  padding: 7px 11px;
  border-radius: 10px;
  background: var(--toast-fill);
  color: var(--toast-ink);
  font-size: 14px;
  line-height: 1.35;
  pointer-events: none;
}

/* =========================================================
 * BOTTOM TABS
 * ========================================================= */
.tab-bar {
  position: fixed; inset-inline: 0; bottom: 0;
  z-index: 10;
  display: flex; justify-content: center;
  background: var(--surface-card);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-bar__inner { display: flex; width: 100%; max-width: 480px; }
.tab-button {
  position: relative;
  flex: 1;
  min-height: 62px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 0; background: transparent;
  color: var(--ink-faint);
  font-size: 13px;
}
.tab-button svg { width: 22px; height: 22px; }
.tab-button[aria-current="page"] { color: var(--ink-strong); font-weight: 600; }
.tab-button .live-dot {
  position: absolute; top: 10px; margin-inline-start: 26px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--side-right);
}

/* =========================================================
 * SHEETS (bottom dialogs for add / edit / bottle / backup)
 * ========================================================= */
.sheet {
  width: 100%;
  max-width: 480px;
  max-height: 92dvh;
  margin: auto auto 0;
  padding: 0;
  border: 0;
  border-radius: 24px 24px 0 0;
  background: var(--surface-card);
  color: var(--ink);
}
.sheet::backdrop { background: var(--scrim); }
.sheet__body { padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); }
.sheet h2 { margin: 0 0 4px; font-size: 21px; font-weight: 600; color: var(--ink-strong); }
.sheet p { margin: 6px 0 0; color: var(--ink-soft); font-size: 15px; }
.field { margin-top: 18px; }
.field > label, .field > .field-label { display: block; font-size: 15px; color: var(--ink-soft); margin-bottom: 6px; }
.text-input {
  width: 100%;
  min-height: 50px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface-page);
  color: var(--ink-strong);
  font-size: 17px;
}
.stepper-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper-row__label { font-size: 18px; font-weight: 600; color: var(--ink-strong); display: inline-flex; align-items: center; gap: 8px; }
.stepper-row__label .swatch { width: 12px; height: 12px; border-radius: 50%; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button {
  width: 46px; height: 46px;
  border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface-page); color: var(--ink-strong);
  font-size: 22px; line-height: 1;
}
.stepper input {
  width: 72px; min-height: 46px;
  border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface-page); color: var(--ink-strong);
  text-align: center; font-size: 19px; font-variant-numeric: tabular-nums;
}
.stepper__unit { font-size: 15px; color: var(--ink-soft); min-width: 30px; }
.segmented { display: flex; gap: 8px; }
.segmented label {
  flex: 1;
  min-height: 46px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 14px;
  color: var(--ink);
}
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented input:checked + span { font-weight: 600; color: var(--ink-strong); }
.segmented label:has(input:checked) { border-color: var(--ink-soft); background: var(--surface-sunken); }
.segmented label:has(input:focus-visible) { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.volume-presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.volume-presets button {
  min-height: 40px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 999px;
  background: transparent; color: var(--ink); font-size: 15px;
}
.form-error { min-height: 1.4em; margin: 12px 0 0 !important; color: var(--danger) !important; font-size: 14px; }
.sheet-actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-top: 10px; }
.backup-actions { display: grid; gap: 10px; margin-top: 18px; }
.sheet .button--secondary { background: var(--surface-sunken); }
.backup-meta { font-size: 14px !important; }

/* =========================================================
 * TOAST
 * ========================================================= */
.toast {
  position: fixed;
  z-index: 20;
  inset-inline: 16px;
  bottom: calc(76px + env(safe-area-inset-bottom));
  max-width: 448px;
  margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 10px 10px 16px;
  padding-inline-start: 16px;
  border-radius: 16px;
  background: var(--toast-fill);
  color: var(--toast-ink);
  font-size: 15px;
}
.toast button {
  min-height: 40px; padding: 0 14px;
  border: 0; border-radius: 12px;
  background: transparent; color: var(--toast-ink);
  font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
}

/* =========================================================
 * RESUME CARD — continue a feed saved a few minutes ago
 * ========================================================= */
.resume-card { margin-top: 24px; padding: 16px 18px 18px; border-radius: 22px; background: var(--surface-card); }
.resume-card__title { margin: 0; font-size: 18px; font-weight: 600; color: var(--ink-strong); }
.resume-card__detail { margin: 4px 0 0; font-size: 15px; color: var(--ink-soft); }
.resume-card .button { margin-top: 14px; width: 100%; }
.resume-card + .suggestion { margin-top: 22px; }
.version-note { margin: 18px 0 0 !important; text-align: center; font-size: 13px !important; color: var(--ink-faint) !important; }

/* =========================================================
 * FOOD — meal diary + foods-tried collection
 * ========================================================= */
.food-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.food-header .button { min-height: 46px; border-radius: 14px; font-size: 16px; padding: 0 18px; }
.food-progress { margin: 10px 0 0; color: var(--ink); font-size: 16px; max-width: 34ch; }
.food-progress strong { color: var(--ink-strong); font-weight: 600; }
.meal-foods { font-size: 15px; color: var(--ink-strong); }
.new-badge {
  display: inline-block;
  margin-inline-start: 4px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--side-right-soft);
  color: var(--ink-strong);
  font-size: 12px;
  font-weight: 600;
  vertical-align: 1px;
}
.meal-meta { display: block; font-size: 13px; color: var(--ink-soft); }
.reaction-text { display: block; font-size: 13px; color: var(--danger); font-weight: 500; }
.liking-emoji { font-size: 22px; line-height: 1; }

.food-group { margin-top: 18px; }
.food-group__head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 8px; }
.food-group__title { margin: 0; font-size: 16px; font-weight: 600; color: var(--ink-strong); }
.food-group__count { font-size: 13px; color: var(--ink-soft); }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.food-chip {
  min-height: 40px;
  padding: 0 13px;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px dashed var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--ink-soft);
  font-size: 15px;
}
.food-chip.is-tried { border-style: solid; border-color: transparent; background: var(--surface-card); color: var(--ink-strong); }
.food-chip__count { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.food-chip .reaction-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
/* selectable chips inside the meal sheet */
.sheet .food-chip { border-style: solid; }
.sheet .food-chip[aria-pressed="true"] { border-color: var(--ink-strong); background: var(--ink-strong); color: var(--surface-card); font-weight: 600; }
.sheet .food-group { margin-top: 14px; }
.sheet .food-group__title { font-size: 14px; font-weight: 500; color: var(--ink-soft); }
.custom-food-row { display: flex; gap: 8px; margin-top: 14px; }
.custom-food-row .text-input { flex: 1; min-height: 44px; font-size: 16px; }
.custom-food-row .button { min-height: 44px; border-radius: 14px; font-size: 15px; }
.allergen-note {
  margin: 12px 0 0 !important;
  padding: 9px 12px;
  border-radius: 12px;
  background: var(--side-right-soft);
  color: var(--ink) !important;
  font-size: 14px !important;
}
.segmented--wrap { flex-wrap: wrap; }
.segmented--wrap label { flex: 1 1 40%; }
.segmented label span { padding: 4px; text-align: center; }
.text-input--reaction { color: var(--danger); }

/* =========================================================
 * MOMENTS — small surprises (easter eggs)
 * ========================================================= */
.title-tap { cursor: default; user-select: none; -webkit-user-select: none; }
.moment {
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-items: center;
  padding: 24px;
  background: var(--scrim);
}
.moment__card {
  width: 100%; max-width: 340px;
  padding: 30px 22px 20px;
  border-radius: 28px;
  background: var(--surface-card);
  text-align: center;
  animation: moment-in 0.35s ease-out;
}
.moment__art { font-size: 64px; line-height: 1; }
.moment__title { margin: 16px 0 0; font-size: 25px; font-weight: 600; line-height: 1.3; color: var(--ink-strong); }
.moment__text { margin: 8px 0 0; font-size: 16px; color: var(--ink); }
.moment__card .button { margin-top: 22px; width: 100%; }
@keyframes moment-in { from { transform: scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
.hearts { position: fixed; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; }
.hearts span {
  position: absolute; bottom: -40px;
  color: var(--heart);
  animation: heart-rise 3.4s ease-in forwards;
}
@keyframes heart-rise {
  0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
  12% { opacity: 1; }
  100% { transform: translate(var(--drift), -108vh) scale(1.1); opacity: 0; }
}
.night-note { margin: 4px 0 0; font-size: 15px; color: var(--ink-soft); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .hearts { display: none; }
}
</style>
</head>
<body>

  <header class="app-header">

    <button class="icon-button" type="button" data-action="open-backup" aria-label="הגדרות וגיבוי">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">

  </p>

  <main>

<nav class="tab-bar" aria-label="מסכים">

<script>
'use strict';

/* =====================================================================
 * 1. CONFIGURATION & CONSTANTS
 * ===================================================================== */

const STORAGE_KEYS = {
  entries: 'feedingTracker.v1.entries',             // array of completed feeds (breast + bottle)
  activeSession: 'feedingTracker.v1.activeSession', // the breastfeed currently in progress, or absent
  lastBackupMs: 'feedingTracker.v1.lastBackupMs',   // when the last backup file was saved
  insightsRangeDays: 'feedingTracker.v1.insightsRangeDays',
  meals: 'feedingTracker.v1.meals',                 // solid-food meals
  momentsSeen: 'feedingTracker.v1.momentsSeen',     // which one-time surprises were already shown
  babyName: 'feedingTracker.v1.babyName',           // typed once in settings
  nameAsked: 'feedingTracker.v1.nameAsked',         // the first-run "what's her name?" sheet was shown
};

// The baby's name is typed once on the phone (settings) and kept only in this browser.
// Until then, the title says "יומן" and the messages say "הקטנה".
const GENERIC_APP_TITLE = 'יומן';
const NAME_FALLBACK = 'הקטנה';
const MAX_BABY_NAME_LENGTH = 20;

/** The name to use inside sentences. */
function babyLabel() {
  return appState.babyName || NAME_FALLBACK;
}

// Shown in settings so you can tell which version a phone is running.
// Keep in sync with CACHE_NAME in sw.js (bump both on every release).
const APP_VERSION = '4';

const SIDE = { RIGHT: 'R', LEFT: 'L' };
const SIDE_LABEL = { R: 'ימין', L: 'שמאל' };
// "להתחיל בימין" / "להתחיל בשמאל" — the side name with the Hebrew prefix ב
const SIDE_LABEL_WITH_BET = { R: 'בימין', L: 'בשמאל' };

const MS_PER_SECOND = 1000;
const MS_PER_MINUTE = 60 * MS_PER_SECOND;
const MS_PER_HOUR = 60 * MS_PER_MINUTE;
const MS_PER_DAY = 24 * MS_PER_HOUR;

// A side used for less than this in a feed is treated as a mis-tap
// when deciding which side the feed started on.
const MIN_MEANINGFUL_SIDE_MS = 30 * MS_PER_SECOND;
// Feeds shorter than this are discarded instead of saved (accidental start/finish).
const MIN_SAVED_FEED_MS = 5 * MS_PER_SECOND;
// Gaps longer than this are assumed to be missing logs, not real intervals.
const MAX_REALISTIC_GAP_MS = 12 * MS_PER_HOUR;
// Window used for the "on average every X hours" line on the home screen.
const RECENT_AVERAGE_WINDOW_MS = 3 * MS_PER_DAY;
// After this long, the active-feed screen gently asks whether finishing was forgotten.
const LONG_FEED_NOTE_AFTER_MS = 90 * MS_PER_MINUTE;
const UNDO_WINDOW_MS = 7000;
// A saved breastfeed can be resumed (baby cried for more) for this long after it ended.
const RESUME_WINDOW_MS = 30 * MS_PER_MINUTE;
// Backup reminder dot appears when there is enough data and no recent backup.
const BACKUP_REMINDER_AFTER_MS = 7 * MS_PER_DAY;
const BACKUP_REMINDER_MIN_ENTRIES = 15;
// Night window used in insights (22:00–06:00).
const NIGHT_START_HOUR = 22;
const NIGHT_END_HOUR = 6;
const HISTORY_DAYS_PAGE_SIZE = 14;
// "Busiest hours" is shown only when a 3-hour window holds at least this share of feeds
// (an even spread over the day would be 3/24 = 12.5%).
const BUSIEST_WINDOW_MIN_SHARE = 0.22;
const INSIGHTS_RANGE_OPTIONS = [7, 14, 30];
// Breast feeds of this length fill the full width of the small split bar in history.
const SPLIT_BAR_FULL_SCALE_MS = 40 * MS_PER_MINUTE;
// Dial ring radius in a 100×100 viewBox (a 5-unit stroke then reaches the edge of the button).
const DIAL_RING_RADIUS = 47.5;

/* ---------- solid food catalog ---------- */
// The 8 common allergens shown as a group of their own.
// `food` is the everyday food used to log it when tapping the allergen.
const ALLERGENS = [
  { key: 'peanut', label: 'בוטנים', food: 'במבה' },
  { key: 'egg', label: 'ביצה', food: 'ביצה' },
  { key: 'dairy', label: 'חלב', food: 'יוגורט' },
  { key: 'sesame', label: 'שומשום', food: 'טחינה' },
  { key: 'wheat', label: 'חיטה', food: 'פסטה' },
  { key: 'fish', label: 'דגים', food: 'דג' },
  { key: 'treeNuts', label: 'אגוזים', food: 'אגוזים טחונים' },
  { key: 'soy', label: 'סויה', food: 'טופו' },
];
// Which allergen each food contains (any food not listed contains none of the 8).
const FOOD_TO_ALLERGEN = {
  'במבה': 'peanut', 'חמאת בוטנים': 'peanut',
  'ביצה': 'egg',
  'יוגורט': 'dairy', 'גבינה לבנה': 'dairy',
  'טחינה': 'sesame',
  'פסטה': 'wheat', 'לחם': 'wheat', 'פתיתים': 'wheat',
  'דג': 'fish',
  'אגוזים טחונים': 'treeNuts',
  'טופו': 'soy',
};
// Food groups for the collection and the meal picker. The allergen group lists the representative foods.
const FOOD_GROUPS = [
  { id: 'allergens', title: 'אלרגנים נפוצים', foods: ALLERGENS.map(allergen => allergen.food) },
  { id: 'vegetables', title: 'ירקות', foods: ['בטטה', 'גזר', 'קישוא', 'דלעת', 'ברוקולי', 'כרובית', 'תפוח אדמה', 'אפונה', 'שעועית ירוקה', 'תרד', 'עגבנייה', 'מלפפון'] },
  { id: 'fruits', title: 'פירות', foods: ['בננה', 'אבוקדו', 'תפוח', 'אגס', 'אפרסק', 'שזיף', 'מנגו', 'אבטיח', 'מלון', 'תות', 'אוכמניות', 'תמר'] },
  { id: 'grains', title: 'דגנים', foods: ['שיבולת שועל', 'אורז', 'קינואה', 'כוסמת', 'תירס', 'לחם', 'פתיתים'] },
  { id: 'proteins', title: 'חלבונים וקטניות', foods: ['עוף', 'הודו', 'בקר', 'עדשים', 'חומוס', 'שעועית', 'גבינה לבנה', 'חמאת בוטנים'] },
];
const CATALOG_FOOD_NAMES = new Set(FOOD_GROUPS.flatMap(group => group.foods));
const MEAL_AMOUNTS = { taste: 'טעימה', spoons: 'כמה כפיות', half: 'חצי מנה', most: 'כמעט הכול' };
const MEAL_LIKINGS = {
  loved: { emoji: '😋', label: 'אהבה' },
  ok: { emoji: '😐', label: 'ככה ככה' },
  refused: { emoji: '🙅‍♀️', label: 'סירבה' },
};
const MEAL_DAYS_PAGE_SIZE = 7;
const MAX_FOOD_NAME_LENGTH = 30;
const MAX_REACTION_NOTE_LENGTH = 120;
// Show the "wait between new allergens" note when another allergen was first given within this window.
const NEW_ALLERGEN_SPACING_MS = 3 * MS_PER_DAY;

/* ---------- moments (easter eggs) ---------- */
const BREASTFEED_MILESTONES = [50, 100, 200, 300, 500, 750, 1000];
const FOODS_TRIED_MILESTONES = [10, 25, 50, 100];
const SWEET_TOAST_CHANCE = 0.12;
const SWEET_TOAST_ENDINGS = () => ['אנחנו אוהבים אותך 💛', 'את אמא מדהימה', `${babyLabel()} שבעה ומרוצה`, 'גאים בך'];
const NIGHT_NOTES = () => [
  `רק את, ${babyLabel()} והירח ערות עכשיו.`,
  'כל העיר ישנה, ואת גיבורה.',
  `${babyLabel()} בידיים הכי טובות שיש.`,
  'עוד מעט בוקר. אנחנו אוהבים אותך.',
];
const MORNING_ENDINGS = () => [
  'מגיע לך קפה חם, ושמישהו אחר יכין אותו.',
  'אנחנו אוהבים אותך.',
  'מגיע לך חיבוק ארוך.',
  `${babyLabel()} ואבא גאים בך.`,
];
const TITLE_TAPS_FOR_LOVE = 5;
const TITLE_TAP_WINDOW_MS = 2500;
const DIAL_RING_CIRCUMFERENCE = 2 * Math.PI * DIAL_RING_RADIUS;


/* =====================================================================
 * 2. STORAGE LAYER
 * localStorage when available; an in-memory fallback otherwise (with a visible warning).
 * ===================================================================== */

const storage = (() => {
  const memoryFallback = new Map();
  let isLocalStorageUsable = probeLocalStorage();

  function probeLocalStorage() {
    try {
      const probeKey = 'feedingTracker.probe';
      window.localStorage.setItem(probeKey, '1');
      window.localStorage.removeItem(probeKey);
      return true;
    } catch (error) {
      return false;
    }
  }

  function readJson(key, fallbackValue) {
    try {
      const rawValue = isLocalStorageUsable ? window.localStorage.getItem(key) : memoryFallback.get(key);
      return rawValue == null ? fallbackValue : JSON.parse(rawValue);
    } catch (error) {
      return fallbackValue;
    }
  }

  function writeJson(key, value) {
    const rawValue = JSON.stringify(value);
    if (isLocalStorageUsable) {
      try {
        window.localStorage.setItem(key, rawValue);
        return;
      } catch (error) {
        // Quota or security error: keep working in memory and tell the user.
        isLocalStorageUsable = false;
        renderStorageNotice();
      }
    }
    memoryFallback.set(key, rawValue);
  }

  function remove(key) {
    if (isLocalStorageUsable) {
      try { window.localStorage.removeItem(key); } catch (error) { /* ignore */ }
    }
    memoryFallback.delete(key);
  }

  return {
    readJson,
    writeJson,
    remove,
    get isPersistent() { return isLocalStorageUsable; },
  };
})();

/** Ask the browser not to evict this page's data under storage pressure (best effort). */
function requestPersistentStorageOnce() {
  if (requestPersistentStorageOnce.done) return;
  requestPersistentStorageOnce.done = true;
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (error) { /* not supported here */ }
}


/* =====================================================================
 * 3. APP STATE
 * ===================================================================== */

const appState = {
  entries: [],             // completed feeds, sorted by startMs ascending
  activeSession: null,     // { startMs, segments: [{ side, startMs, endMs|null }] } — open segment has endMs null
  currentTab: 'home',
  insightsRangeDays: 7,
  historyDaysShown: HISTORY_DAYS_PAGE_SIZE,
  pendingUndo: null,       // { entryId, sessionToRestore, timeoutId }
  meals: [],               // solid-food meals, sorted by startMs ascending
  mealDaysShown: MEAL_DAYS_PAGE_SIZE,
  babyName: '',            // '' until set in settings
};

function loadStateFromStorage() {
  const storedEntries = storage.readJson(STORAGE_KEYS.entries, []);
  appState.entries = (Array.isArray(storedEntries) ? storedEntries : []).filter(isValidEntry);
  sortEntriesChronologically(appState.entries);

  const storedSession = storage.readJson(STORAGE_KEYS.activeSession, null);
  appState.activeSession = isValidActiveSession(storedSession) ? storedSession : null;

  const storedName = storage.readJson(STORAGE_KEYS.babyName, '');
  appState.babyName = typeof storedName === 'string' ? storedName.slice(0, MAX_BABY_NAME_LENGTH) : '';

  const storedMeals = storage.readJson(STORAGE_KEYS.meals, []);
  appState.meals = (Array.isArray(storedMeals) ? storedMeals : []).filter(isValidMeal);
  sortEntriesChronologically(appState.meals);

  const storedRange = storage.readJson(STORAGE_KEYS.insightsRangeDays, 7);
  appState.insightsRangeDays = INSIGHTS_RANGE_OPTIONS.includes(storedRange) ? storedRange : 7;
}

function saveEntries() {
  sortEntriesChronologically(appState.entries);
  storage.writeJson(STORAGE_KEYS.entries, appState.entries);
}

function saveMeals() {
  sortEntriesChronologically(appState.meals);
  storage.writeJson(STORAGE_KEYS.meals, appState.meals);
}

function saveActiveSession() {
  if (appState.activeSession) storage.writeJson(STORAGE_KEYS.activeSession, appState.activeSession);
  else storage.remove(STORAGE_KEYS.activeSession);
}

function sortEntriesChronologically(entries) {
  entries.sort((first, second) => first.startMs - second.startMs);
}

function createEntryId() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

/** Validates a stored or imported entry so corrupted data never breaks rendering. */
function isValidEntry(candidate) {
  if (!candidate || typeof candidate !== 'object') return false;
  if (typeof candidate.id !== 'string' || !Number.isFinite(candidate.startMs)) return false;
  if (candidate.type === 'bottle') {
    return Number.isFinite(candidate.volumeMl) && candidate.volumeMl > 0;
  }
  if (candidate.type === 'breast') {
    return Number.isFinite(candidate.endMs)
      && Array.isArray(candidate.segments)
      && candidate.segments.length > 0
      && candidate.segments.every(segment =>
        (segment.side === SIDE.RIGHT || segment.side === SIDE.LEFT)
        && Number.isFinite(segment.startMs)
        && Number.isFinite(segment.endMs)
        && segment.endMs >= segment.startMs);
  }
  return false;
}

function isValidMeal(candidate) {
  return Boolean(candidate)
    && typeof candidate.id === 'string'
    && Number.isFinite(candidate.startMs)
    && Array.isArray(candidate.foods)
    && candidate.foods.length > 0
    && candidate.foods.every(food => typeof food === 'string' && food.trim().length > 0)
    && (candidate.amount == null || Object.prototype.hasOwnProperty.call(MEAL_AMOUNTS, candidate.amount))
    && (candidate.liking == null || Object.prototype.hasOwnProperty.call(MEAL_LIKINGS, candidate.liking))
    && (candidate.reaction == null || typeof candidate.reaction === 'string');
}

function isValidActiveSession(candidate) {
  return Boolean(candidate)
    && Number.isFinite(candidate.startMs)
    && Array.isArray(candidate.segments)
    && candidate.segments.length > 0
    && candidate.segments.every(segment =>
      (segment.side === SIDE.RIGHT || segment.side === SIDE.LEFT) && Number.isFinite(segment.startMs));
}


/* =====================================================================
 * 4. TIME & FORMATTING HELPERS (Hebrew)
 * ===================================================================== */

const WEEKDAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const WEEKDAY_LETTERS = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];

function padTwoDigits(number) {
  return String(number).padStart(2, '0');
}

/** 14:05 */
function formatClockTime(timestampMs) {
  const date = new Date(timestampMs);
  return `${padTwoDigits(date.getHours())}:${padTwoDigits(date.getMinutes())}`;
}

/** 14.10 */
function formatDayMonth(timestampMs) {
  const date = new Date(timestampMs);
  return `${date.getDate()}.${date.getMonth() + 1}`;
}

/** Local midnight of the day containing the timestamp (DST-safe). */
function startOfLocalDay(timestampMs) {
  const date = new Date(timestampMs);
  return new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
}

/** Local midnight N days after a local midnight (DST-safe: steps by calendar days, not 24h). */
function addLocalDays(dayStartMs, numberOfDays) {
  const date = new Date(dayStartMs);
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + numberOfDays).getTime();
}

/** "היום" / "אתמול" / "יום שלישי, 12.10" */
function formatDayHeading(dayStartMs, nowMs) {
  const todayStartMs = startOfLocalDay(nowMs);
  if (dayStartMs === todayStartMs) return 'היום';
  if (dayStartMs === addLocalDays(todayStartMs, -1)) return 'אתמול';
  return `יום ${WEEKDAY_NAMES[new Date(dayStartMs).getDay()]}, ${formatDayMonth(dayStartMs)}`;
}

/** Short day label for charts: "היום" / "ג׳ 12.10" */
function formatChartDayLabel(dayStartMs, nowMs) {
  if (dayStartMs === startOfLocalDay(nowMs)) return 'היום';
  return `${WEEKDAY_LETTERS[new Date(dayStartMs).getDay()]} ${formatDayMonth(dayStartMs)}`;
}

/** Running timer: 7:05 or 1:02:09 */
function formatTimerClock(durationMs) {
  const totalSeconds = Math.max(0, Math.floor(durationMs / MS_PER_SECOND));
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return hours > 0
    ? `${hours}:${padTwoDigits(minutes)}:${padTwoDigits(seconds)}`
    : `${minutes}:${padTwoDigits(seconds)}`;
}

/** "12 דק׳" / "פחות מדקה" */
function formatMinutesShort(durationMs) {
  const roundedMinutes = Math.round(durationMs / MS_PER_MINUTE);
  return roundedMinutes < 1 ? 'פחות מדקה' : `${roundedMinutes} דק׳`;
}

/** 2:14 (hours:minutes, rounded to the nearest minute) */
function formatHoursMinutes(durationMs) {
  const totalMinutes = Math.round(durationMs / MS_PER_MINUTE);
  return `${Math.floor(totalMinutes / 60)}:${padTwoDigits(totalMinutes % 60)}`;
}

/** "47 דק׳" under an hour, otherwise "2:14 שע׳" */
function formatDurationShort(durationMs) {
  return durationMs < MS_PER_HOUR - 30 * MS_PER_SECOND
    ? formatMinutesShort(durationMs)
    : `${formatHoursMinutes(durationMs)} שע׳`;
}

/** For sentences: "47 דקות" under an hour, otherwise "2:49 שעות". */
function formatGapForSentence(durationMs) {
  const totalMinutes = Math.round(durationMs / MS_PER_MINUTE);
  if (totalMinutes < 60) return totalMinutes === 1 ? 'דקה' : `${totalMinutes} דקות`;
  return `${formatHoursMinutes(durationMs)} שעות`;
}

/** "ההנקה הסתיימה לפני 4 דקות" (for the resume card). */
function formatEndedAgo(elapsedMs) {
  return elapsedMs < MS_PER_MINUTE ? 'ההנקה הסתיימה הרגע' : `ההנקה הסתיימה לפני ${formatGapForSentence(elapsedMs)}`;
}

/** Elapsed time for the big "last feed started … ago" number: { number, unit }. */
function formatElapsedParts(elapsedMs) {
  if (elapsedMs < MS_PER_MINUTE) return { number: 'רגע', unit: '' };
  if (elapsedMs < MS_PER_HOUR) {
    const minutes = Math.floor(elapsedMs / MS_PER_MINUTE);
    return { number: String(minutes), unit: minutes === 1 ? 'דקה' : 'דקות' };
  }
  if (elapsedMs < MS_PER_DAY) {
    const hours = Math.floor(elapsedMs / MS_PER_HOUR);
    const minutes = Math.floor((elapsedMs % MS_PER_HOUR) / MS_PER_MINUTE);
    return { number: `${hours}:${padTwoDigits(minutes)}`, unit: 'שעות' };
  }
  const days = Math.floor(elapsedMs / MS_PER_DAY);
  return { number: String(days), unit: days === 1 ? 'יום' : 'ימים' };
}

/** "הנקה אחת" / "6 הנקות" */
function formatBreastfeedCount(count) {
  return count === 1 ? 'הנקה אחת' : `${count} הנקות`;
}

/** "בקבוק אחד" / "2 בקבוקים" */
function formatBottleCount(count) {
  return count === 1 ? 'בקבוק אחד' : `${count} בקבוקים`;
}

/** Value for <input type="datetime-local"> in local time: 2026-10-14T14:05 */
function toDateTimeInputValue(timestampMs) {
  const date = new Date(timestampMs);
  return `${date.getFullYear()}-${padTwoDigits(date.getMonth() + 1)}-${padTwoDigits(date.getDate())}`
    + `T${padTwoDigits(date.getHours())}:${padTwoDigits(date.getMinutes())}`;
}

/** Parses a datetime-local value as local time; NaN when empty or invalid. */
function fromDateTimeInputValue(inputValue) {
  if (!inputValue) return NaN;
  return new Date(inputValue).getTime();
}

/** File-name friendly date: 2026-10-14 */
function formatDateStamp(timestampMs) {
  const date = new Date(timestampMs);
  return `${date.getFullYear()}-${padTwoDigits(date.getMonth() + 1)}-${padTwoDigits(date.getDate())}`;
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function clampInteger(rawValue, minimum, maximum) {
  const parsed = Math.round(Number(rawValue));
  if (!Number.isFinite(parsed)) return minimum;
  return Math.min(maximum, Math.max(minimum, parsed));
}

function haptic() {
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (error) { /* ignore */ }
}


/* =====================================================================
 * 5. DOMAIN LOGIC — sides, durations, suggestion
 * ===================================================================== */

function oppositeSide(side) {
  return side === SIDE.RIGHT ? SIDE.LEFT : SIDE.RIGHT;
}

/** Duration of one segment; an open segment (endMs null) runs until nowMs. */
function segmentDurationMs(segment, nowMs) {
  const segmentEndMs = segment.endMs == null ? nowMs : segment.endMs;
  return Math.max(0, segmentEndMs - segment.startMs);
}

/** Total time on each side: { R: ms, L: ms } */
function sumDurationsBySide(segments, nowMs = Date.now()) {
  const totalsBySide = { R: 0, L: 0 };
  for (const segment of segments) totalsBySide[segment.side] += segmentDurationMs(segment, nowMs);
  return totalsBySide;
}

function totalFeedingMs(segments, nowMs = Date.now()) {
  const totalsBySide = sumDurationsBySide(segments, nowMs);
  return totalsBySide.R + totalsBySide.L;
}

/**
 * Sides actually used in a feed, in the order they were first used.
 * A side with less than MIN_MEANINGFUL_SIDE_MS in total is ignored (a mis-tap), unless it is all there is.
 */
function getSidesInOrderOfUse(segments, nowMs = Date.now()) {
  const totalsBySide = sumDurationsBySide(segments, nowMs);
  const orderedSides = [];
  for (const segment of segments) {
    if (!orderedSides.includes(segment.side) && totalsBySide[segment.side] >= MIN_MEANINGFUL_SIDE_MS) {
      orderedSides.push(segment.side);
    }
  }
  return orderedSides.length > 0 ? orderedSides : [segments[0].side];
}

/** The side the feed ended on (ignoring mis-tap sides). */
function getLastUsedSide(segments, nowMs = Date.now()) {
  const meaningfulSides = getSidesInOrderOfUse(segments, nowMs);
  for (let index = segments.length - 1; index >= 0; index -= 1) {
    if (meaningfulSides.includes(segments[index].side)) return segments[index].side;
  }
  return segments[segments.length - 1].side;
}

function findLastBreastfeed(entries) {
  for (let index = entries.length - 1; index >= 0; index -= 1) {
    if (entries[index].type === 'breast') return entries[index];
  }
  return null;
}

/**
 * Next-side suggestion.
 * Rule: start on the side opposite to where the last breastfeed STARTED.
 *  - One-side feed (e.g. only right)  → suggest the other side (left).
 *  - Both sides (e.g. left, then right) → suggest the side she finished on (right),
 *    so the side that went first alternates from feed to feed.
 */
function computeSideSuggestion(entries) {
  const lastBreastfeed = findLastBreastfeed(entries);
  if (!lastBreastfeed) return null;
  const sidesInOrder = getSidesInOrderOfUse(lastBreastfeed.segments);
  const startingSide = sidesInOrder[0];
  return {
    suggestedSide: oppositeSide(startingSide),
    sidesInOrder,
    usedBothSides: sidesInOrder.length === 2,
    lastUsedSide: getLastUsedSide(lastBreastfeed.segments),
    lastBreastfeed,
  };
}

/** "שמאל 12 דק׳, ימין 6 דק׳" */
function describeSides(segments) {
  const totalsBySide = sumDurationsBySide(segments);
  return getSidesInOrderOfUse(segments)
    .map(side => `${SIDE_LABEL[side]} ${formatMinutesShort(totalsBySide[side])}`)
    .join(', ');
}

/** One-line description used in history, tooltips and the home screen. */
function describeEntry(entry) {
  if (entry.type === 'bottle') return `בקבוק ${entry.volumeMl} מ״ל`;
  return describeSides(entry.segments);
}

/** Time between consecutive feeds (start to start), ignoring implausibly long gaps. */
function computeIntervals(sortedEntries) {
  const intervals = [];
  for (let index = 1; index < sortedEntries.length; index += 1) {
    const gapMs = sortedEntries[index].startMs - sortedEntries[index - 1].startMs;
    if (gapMs > 0 && gapMs <= MAX_REALISTIC_GAP_MS) {
      intervals.push({ fromMs: sortedEntries[index - 1].startMs, toMs: sortedEntries[index].startMs, gapMs });
    }
  }
  return intervals;
}

/** Average start-to-start gap over the recent window, or null if too little data. */
function computeRecentAverageGapMs(entries, nowMs) {
  const recentIntervals = computeIntervals(entries).filter(interval => interval.toMs >= nowMs - RECENT_AVERAGE_WINDOW_MS);
  if (recentIntervals.length < 3) return null;
  return recentIntervals.reduce((sum, interval) => sum + interval.gapMs, 0) / recentIntervals.length;
}

function entriesOnDay(entries, dayStartMs) {
  const nextDayStartMs = addLocalDays(dayStartMs, 1);
  return entries.filter(entry => entry.startMs >= dayStartMs && entry.startMs < nextDayStartMs);
}


/* =====================================================================
 * 6. ACTIONS — the active feed
 * ===================================================================== */

function getOpenSegment(session) {
  const lastSegment = session.segments[session.segments.length - 1];
  return lastSegment.endMs == null ? lastSegment : null;
}

function getCurrentSide(session) {
  return session.segments[session.segments.length - 1].side;
}

function startFeeding(side) {
  const nowMs = Date.now();
  appState.activeSession = { startMs: nowMs, segments: [{ side, startMs: nowMs, endMs: null }] };
  clearPendingUndo();
  saveActiveSession();
  requestPersistentStorageOnce();
  haptic();
  renderAll();
}

/** Tap on a dial during a feed: switch to that side, or resume on it when paused. */
function switchOrResumeOnSide(side) {
  const session = appState.activeSession;
  if (!session) return;
  const nowMs = Date.now();
  const openSegment = getOpenSegment(session);
  if (openSegment && openSegment.side === side) return; // already feeding on this side
  if (openSegment) openSegment.endMs = nowMs;
  session.segments.push({ side, startMs: nowMs, endMs: null });
  saveActiveSession();
  haptic();
  renderAll();
}

/**
 * The last saved breastfeed, if it ended recently enough to still count as the same feed
 * (the baby cried for more a few minutes after it was saved).
 * Null when there is nothing to resume: no feed, too long ago, or a feed is already running.
 */
function findResumableFeed(nowMs) {
  if (appState.activeSession) return null;
  const lastBreastfeed = findLastBreastfeed(appState.entries);
  if (!lastBreastfeed) return null;
  const msSinceEnd = nowMs - lastBreastfeed.endMs;
  // Slightly negative is fine (a manual entry); clearly in the future means a wrong clock, so do not offer.
  if (msSinceEnd < -MS_PER_MINUTE || msSinceEnd > RESUME_WINDOW_MS) return null;
  return lastBreastfeed;
}

/**
 * Reopens the last saved feed as a running one.
 *  - The feed keeps its original start time and all its earlier segments.
 *  - A new segment starts now on the side she finished on; the time in between is not counted.
 *  - Tapping the other side still switches sides, as in any feed.
 */
function resumeLastSavedFeeding() {
  const nowMs = Date.now();
  const feedToResume = findResumableFeed(nowMs);
  if (!feedToResume) return;

  const restoredSegments = feedToResume.segments.map(segment => ({ side: segment.side, startMs: segment.startMs, endMs: segment.endMs }));
  const resumeSide = getLastUsedSide(restoredSegments);
  restoredSegments.push({ side: resumeSide, startMs: nowMs, endMs: null });

  // Running session first, then remove the saved entry: a failure in between can never lose the feed.
  appState.activeSession = { startMs: feedToResume.startMs, segments: restoredSegments };
  saveActiveSession();
  appState.entries = appState.entries.filter(entry => entry.id !== feedToResume.id);
  saveEntries();

  clearPendingUndo();
  hideToast();
  haptic();
  renderAll();
  showToast(`ממשיכים ${SIDE_LABEL_WITH_BET[resumeSide]}`);
}

function pauseFeeding() {
  const session = appState.activeSession;
  const openSegment = session && getOpenSegment(session);
  if (!openSegment) return;
  openSegment.endMs = Date.now();
  saveActiveSession();
  haptic();
  renderAll();
}

function resumeFeeding() {
  const session = appState.activeSession;
  if (!session || getOpenSegment(session)) return;
  switchOrResumeOnSide(getCurrentSide(session));
}

function finishFeeding() {
  const session = appState.activeSession;
  if (!session) return;
  const nowMs = Date.now();
  const openSegment = getOpenSegment(session);
  const wasRunning = Boolean(openSegment);
  if (openSegment) openSegment.endMs = nowMs;

  // Drop zero-length segments (e.g. pause immediately followed by switch).
  const keptSegments = session.segments.filter(segment => segment.endMs - segment.startMs >= MS_PER_SECOND);
  const totalMs = totalFeedingMs(keptSegments, nowMs);

  appState.activeSession = null;
  saveActiveSession();
  haptic();

  if (keptSegments.length === 0 || totalMs < MIN_SAVED_FEED_MS) {
    renderAll();
    showToast('ההנקה הייתה קצרה מדי ולא נשמרה');
    return;
  }

  const newEntry = {
    id: createEntryId(),
    type: 'breast',
    startMs: session.startMs,
    endMs: nowMs,
    segments: keptSegments.map(segment => ({ side: segment.side, startMs: segment.startMs, endMs: segment.endMs })),
  };
  appState.entries.push(newEntry);
  saveEntries();

  // Undo restores the feed exactly as it was, still running if it was running.
  const sessionToRestore = JSON.parse(JSON.stringify(session));
  if (wasRunning) sessionToRestore.segments[sessionToRestore.segments.length - 1].endMs = null;
  setPendingUndo(newEntry.id, sessionToRestore);

  renderAll();
  // Now and then, a little extra warmth in the confirmation.
  const sweetEnding = Math.random() < SWEET_TOAST_CHANCE ? `. ${pickRandom(SWEET_TOAST_ENDINGS())}` : '';
  showToast(`ההנקה נשמרה: ${formatMinutesShort(totalMs)}${sweetEnding}`, { actionLabel: 'ביטול', onAction: undoLastFinish, durationMs: UNDO_WINDOW_MS });
  if (!maybeShowBreastfeedMilestone()) maybeShowMorningMoment();
}

function discardActiveFeeding() {
  if (!appState.activeSession) return;
  if (!window.confirm('לבטל את ההנקה הנוכחית בלי לשמור אותה?')) return;
  appState.activeSession = null;
  saveActiveSession();
  renderAll();
  showToast('ההנקה בוטלה');
}

function setPendingUndo(entryId, sessionToRestore) {
  clearPendingUndo();
  appState.pendingUndo = {
    entryId,
    sessionToRestore,
    timeoutId: window.setTimeout(clearPendingUndo, UNDO_WINDOW_MS),
  };
}

function clearPendingUndo() {
  if (appState.pendingUndo) window.clearTimeout(appState.pendingUndo.timeoutId);
  appState.pendingUndo = null;
}

function undoLastFinish() {
  const pendingUndo = appState.pendingUndo;
  if (!pendingUndo) return;
  appState.entries = appState.entries.filter(entry => entry.id !== pendingUndo.entryId);
  saveEntries();
  if (!appState.activeSession) {
    appState.activeSession = pendingUndo.sessionToRestore;
    saveActiveSession();
  }
  clearPendingUndo();
  renderAll();
  showToast('ההנקה חזרה לרוץ');
}


/* =====================================================================
 * 7. ACTIONS — saved entries (manual add, edit, delete, bottle)
 * ===================================================================== */

function findEntryById(entryId) {
  return appState.entries.find(entry => entry.id === entryId) || null;
}

function upsertEntry(entry) {
  const existingIndex = appState.entries.findIndex(existing => existing.id === entry.id);
  if (existingIndex >= 0) appState.entries[existingIndex] = entry;
  else appState.entries.push(entry);
  saveEntries();
}

function deleteEntry(entryId) {
  appState.entries = appState.entries.filter(entry => entry.id !== entryId);
  saveEntries();
}

/**
 * Builds breast-feed segments from the manual form: first side, then the other side, back to back.
 * When editing and only the start time changed, the original segments are shifted instead,
 * so mid-feed switches and pauses recorded by the timer are preserved.
 */
function buildBreastSegmentsFromForm({ startMs, minutesBySide, firstSide, originalEntry }) {
  if (originalEntry) {
    const originalTotalsBySide = sumDurationsBySide(originalEntry.segments);
    const originalFirstSide = getSidesInOrderOfUse(originalEntry.segments)[0];
    const durationsUnchanged =
      Math.round(originalTotalsBySide.R / MS_PER_MINUTE) === minutesBySide.R
      && Math.round(originalTotalsBySide.L / MS_PER_MINUTE) === minutesBySide.L;
    const firstSideUnchanged = minutesBySide.R === 0 || minutesBySide.L === 0 || originalFirstSide === firstSide;
    if (durationsUnchanged && firstSideUnchanged) {
      const shiftMs = startMs - originalEntry.startMs;
      return originalEntry.segments.map(segment => ({
        side: segment.side,
        startMs: segment.startMs + shiftMs,
        endMs: segment.endMs + shiftMs,
      }));
    }
  }

  const segments = [];
  let cursorMs = startMs;
  for (const side of [firstSide, oppositeSide(firstSide)]) {
    const sideDurationMs = minutesBySide[side] * MS_PER_MINUTE;
    if (sideDurationMs > 0) {
      segments.push({ side, startMs: cursorMs, endMs: cursorMs + sideDurationMs });
      cursorMs += sideDurationMs;
    }
  }
  return segments;
}


/* =====================================================================
 * 8. INSIGHTS — statistics for the chosen range
 * ===================================================================== */

function computeInsights(allEntries, rangeDays, nowMs) {
  if (allEntries.length === 0) return { isEmpty: true };

  const todayStartMs = startOfLocalDay(nowMs);
  const rangeStartDayMs = addLocalDays(todayStartMs, -(rangeDays - 1));
  const firstTrackedDayMs = startOfLocalDay(allEntries[0].startMs);
  const effectiveStartDayMs = Math.max(rangeStartDayMs, firstTrackedDayMs);

  // One bucket per calendar day in range.
  const dayBuckets = [];
  const bucketByDayStart = new Map();
  for (let dayStartMs = effectiveStartDayMs; dayStartMs <= todayStartMs; dayStartMs = addLocalDays(dayStartMs, 1)) {
    const bucket = {
      dayStartMs,
      nextDayStartMs: addLocalDays(dayStartMs, 1),
      isToday: dayStartMs === todayStartMs,
      isFirstTrackedDay: dayStartMs === firstTrackedDayMs,
      breastfeeds: [],
      bottles: [],
      longestGapMs: 0,
    };
    dayBuckets.push(bucket);
    bucketByDayStart.set(dayStartMs, bucket);
  }

  const entriesInRange = allEntries.filter(entry => entry.startMs >= effectiveStartDayMs);
  for (const entry of entriesInRange) {
    const bucket = bucketByDayStart.get(startOfLocalDay(entry.startMs));
    if (!bucket) continue;
    if (entry.type === 'breast') bucket.breastfeeds.push(entry);
    else bucket.bottles.push(entry);
  }

  // Intervals use ALL entries, so the first gap in range is measured from the feed before it.
  const intervalsInRange = computeIntervals(allEntries).filter(interval => interval.toMs >= effectiveStartDayMs);
  let longestInterval = null;
  for (const interval of intervalsInRange) {
    const bucket = bucketByDayStart.get(startOfLocalDay(interval.toMs));
    if (bucket) bucket.longestGapMs = Math.max(bucket.longestGapMs, interval.gapMs);
    if (!longestInterval || interval.gapMs > longestInterval.gapMs) longestInterval = interval;
  }

  // Per-day averages use complete days only: not today (still running),
  // and not the first tracked day (probably started mid-day) when other full days exist.
  const completedDays = dayBuckets.filter(bucket => !bucket.isToday);
  const fullDays = completedDays.filter(bucket => !bucket.isFirstTrackedDay);
  const averagingDays = fullDays.length > 0 ? fullDays : completedDays;

  const breastfeedsInRange = entriesInRange.filter(entry => entry.type === 'breast');
  const bottlesInRange = entriesInRange.filter(entry => entry.type === 'bottle');

  const sideTotalsMs = { R: 0, L: 0 };
  let totalBreastfeedingMs = 0;
  for (const breastfeed of breastfeedsInRange) {
    const totalsBySide = sumDurationsBySide(breastfeed.segments);
    sideTotalsMs.R += totalsBySide.R;
    sideTotalsMs.L += totalsBySide.L;
    totalBreastfeedingMs += totalsBySide.R + totalsBySide.L;
  }

  const isNightTime = timestampMs => {
    const hour = new Date(timestampMs).getHours();
    return hour >= NIGHT_START_HOUR || hour < NIGHT_END_HOUR;
  };

  const averageOverDays = valueForDay => averagingDays.length
    ? averagingDays.reduce((sum, bucket) => sum + valueForDay(bucket), 0) / averagingDays.length
    : null;

  return {
    isEmpty: false,
    dayBuckets,
    entriesInRange,
    todayBucket: bucketByDayStart.get(todayStartMs) || null,
    averagingDayCount: averagingDays.length,
    averageBreastfeedsPerDay: averageOverDays(bucket => bucket.breastfeeds.length),
    averageNightFeedsPerDay: averageOverDays(bucket =>
      bucket.breastfeeds.concat(bucket.bottles).filter(entry => isNightTime(entry.startMs)).length),
    averageGapMs: intervalsInRange.length
      ? intervalsInRange.reduce((sum, interval) => sum + interval.gapMs, 0) / intervalsInRange.length
      : null,
    longestInterval,
    averageBreastfeedMs: breastfeedsInRange.length ? totalBreastfeedingMs / breastfeedsInRange.length : null,
    sideTotalsMs,
    bottleCount: bottlesInRange.length,
    bottleTotalMl: bottlesInRange.reduce((sum, bottle) => sum + bottle.volumeMl, 0),
    busiestWindow: findBusiestThreeHourWindow(entriesInRange),
  };
}

/** The 3-hour window of the day (wrapping past midnight) with the most feed starts. */
function findBusiestThreeHourWindow(entries) {
  if (entries.length < 10) return null;
  const startsPerHour = new Array(24).fill(0);
  for (const entry of entries) startsPerHour[new Date(entry.startMs).getHours()] += 1;
  let bestStartHour = 0;
  let bestCount = -1;
  for (let hour = 0; hour < 24; hour += 1) {
    const windowCount = startsPerHour[hour] + startsPerHour[(hour + 1) % 24] + startsPerHour[(hour + 2) % 24];
    if (windowCount > bestCount) { bestCount = windowCount; bestStartHour = hour; }
  }
  const share = bestCount / entries.length;
  if (share < BUSIEST_WINDOW_MIN_SHARE) return null; // feeds are spread evenly: nothing worth pointing out
  return { startHour: bestStartHour, endHour: (bestStartHour + 3) % 24, share };
}


/* =====================================================================
 * 9. RENDERING — shared
 * ===================================================================== */

const elements = {
  homeScreen: document.getElementById('screen-home'),
  foodScreen: document.getElementById('screen-food'),
  appTitle: document.getElementById('app-title'),
  moment: document.getElementById('moment'),
  momentArt: document.getElementById('moment-art'),
  momentTitle: document.getElementById('moment-title'),
  momentText: document.getElementById('moment-text'),
  momentButton: document.getElementById('moment-button'),
  hearts: document.getElementById('hearts'),
  historyScreen: document.getElementById('screen-history'),
  insightsScreen: document.getElementById('screen-insights'),
  storageNotice: document.getElementById('storage-notice'),
  backupDot: document.getElementById('backup-dot'),
  liveDot: document.getElementById('live-dot'),
  sheet: document.getElementById('sheet'),
  sheetBody: document.getElementById('sheet-body'),
  importFileInput: document.getElementById('import-file-input'),
  toast: document.getElementById('toast'),
  toastMessage: document.getElementById('toast-message'),
  toastAction: document.getElementById('toast-action'),
  chartTooltip: document.getElementById('chart-tooltip'),
};

function renderAll() {
  renderAppTitle();
  renderStorageNotice();
  renderTabs();
  renderBackupReminderDot();
  if (appState.currentTab === 'home') renderHomeScreen();
  if (appState.currentTab === 'food') renderFoodScreen();
  if (appState.currentTab === 'history') renderHistoryScreen();
  if (appState.currentTab === 'insights') renderInsightsScreen();
  updateLiveValues();
}

function renderAppTitle() {
  const title = appState.babyName || GENERIC_APP_TITLE;
  elements.appTitle.textContent = title;
  document.title = title;
}

function renderStorageNotice() {
  elements.storageNotice.hidden = storage.isPersistent;
}

function renderTabs() {
  document.querySelectorAll('[data-screen]').forEach(screen => {
    screen.hidden = screen.dataset.screen !== appState.currentTab;
  });
  document.querySelectorAll('.tab-button').forEach(tabButton => {
    if (tabButton.dataset.tab === appState.currentTab) tabButton.setAttribute('aria-current', 'page');
    else tabButton.removeAttribute('aria-current');
  });
  // A small dot on the first tab reminds that a feed is running while looking at other tabs.
  elements.liveDot.hidden = !(appState.activeSession && appState.currentTab !== 'home');
}

function isBackupDue(nowMs = Date.now()) {
  if (appState.entries.length + appState.meals.length < BACKUP_REMINDER_MIN_ENTRIES) return false;
  const lastBackupMs = storage.readJson(STORAGE_KEYS.lastBackupMs, null);
  return !lastBackupMs || nowMs - lastBackupMs > BACKUP_REMINDER_AFTER_MS;
}

function renderBackupReminderDot() {
  elements.backupDot.hidden = !isBackupDue();
}

/**
 * Updates only the text that changes every second (timers, "time since").
 * The rest of the DOM is rebuilt only on real state changes, so taps are never lost mid-render.
 */
function updateLiveValues() {
  const nowMs = Date.now();

  const resumeCard = document.querySelector('[data-live="resume-card"]');
  if (resumeCard) {
    const elapsedMs = nowMs - Number(resumeCard.dataset.endMs);
    if (elapsedMs > RESUME_WINDOW_MS) resumeCard.hidden = true;
    else document.querySelector('[data-live="resume-elapsed"]').textContent = formatEndedAgo(elapsedMs);
  }

  const sinceNumber = document.querySelector('[data-live="since-number"]');
  if (sinceNumber) {
    const lastEntry = appState.entries[appState.entries.length - 1];
    if (lastEntry) {
      const elapsedParts = formatElapsedParts(nowMs - lastEntry.startMs);
      sinceNumber.textContent = elapsedParts.number;
      document.querySelector('[data-live="since-unit"]').textContent = elapsedParts.unit;
    }
  }

  const session = appState.activeSession;
  if (!session) return;
  const totalsBySide = sumDurationsBySide(session.segments, nowMs);
  const totalTimer = document.querySelector('[data-live="total-timer"]');
  if (totalTimer) totalTimer.textContent = formatTimerClock(totalsBySide.R + totalsBySide.L);

  for (const side of [SIDE.RIGHT, SIDE.LEFT]) {
    const sideTimer = document.querySelector(`[data-live="side-timer-${side}"]`);
    if (sideTimer) sideTimer.textContent = totalsBySide[side] > 0 ? formatTimerClock(totalsBySide[side]) : '';
  }

  // The running dial's ring sweeps once a minute, like a second hand.
  const openSegment = getOpenSegment(session);
  const sweep = document.querySelector('[data-live="sweep"]');
  if (sweep && openSegment) {
    const secondsIntoMinute = (totalsBySide[openSegment.side] % MS_PER_MINUTE) / MS_PER_MINUTE;
    sweep.setAttribute('stroke-dashoffset', String(DIAL_RING_CIRCUMFERENCE * (1 - secondsIntoMinute)));
  }

  const longFeedNote = document.querySelector('[data-live="long-feed-note"]');
  if (longFeedNote) longFeedNote.hidden = nowMs - session.startMs < LONG_FEED_NOTE_AFTER_MS;
}


/* =====================================================================
 * 10. RENDERING — home (idle) and active feed
 * ===================================================================== */

function renderHomeScreen() {
  elements.homeScreen.innerHTML = appState.activeSession ? buildActiveFeedMarkup() : buildIdleHomeMarkup();
}

/** Markup for one side dial. */
function buildDialMarkup({ side, stateClass, subLabel, showTimer, isRunning, ariaLabel }) {
  const sweepMarkup = isRunning
    ? `<circle class="dial__sweep" cx="50" cy="50" r="${DIAL_RING_RADIUS}" data-live="sweep"
         stroke-dasharray="${DIAL_RING_CIRCUMFERENCE}" stroke-dashoffset="${DIAL_RING_CIRCUMFERENCE}"></circle>`
    : '';
  return `
    <button class="dial ${stateClass}" type="button" data-side="${side}" data-action="dial" aria-label="${escapeHtml(ariaLabel)}">
      <svg class="dial__ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="dial__track" cx="50" cy="50" r="${DIAL_RING_RADIUS}"></circle>
        ${sweepMarkup}
      </svg>
      <span class="dial__name">${SIDE_LABEL[side]}</span>
      ${showTimer ? `<span class="dial__time numeric" data-live="side-timer-${side}"></span>` : ''}
      <span class="dial__sub">${escapeHtml(subLabel)}</span>
    </button>`;
}

/** Offer to continue the feed that was saved a few minutes ago. */
function buildResumeCardMarkup(nowMs) {
  const resumableFeed = findResumableFeed(nowMs);
  if (!resumableFeed) return '';
  const resumeSide = getLastUsedSide(resumableFeed.segments);
  return `
    <section class="resume-card" data-live="resume-card" data-end-ms="${resumableFeed.endMs}">
      <h2 class="resume-card__title">${escapeHtml(babyLabel())} עוד רעבה?</h2>
      <p class="resume-card__detail"><span data-live="resume-elapsed">${formatEndedAgo(nowMs - resumableFeed.endMs)}</span>. ${escapeHtml(describeSides(resumableFeed.segments))}.
        הזמן שעבר לא נספר.</p>
      <button class="button button--primary" type="button" data-action="resume-last">להמשיך את ההנקה ${SIDE_LABEL_WITH_BET[resumeSide]}</button>
    </section>`;
}

function buildIdleHomeMarkup() {
  const nowMs = Date.now();
  const lastEntry = appState.entries[appState.entries.length - 1];
  const suggestion = computeSideSuggestion(appState.entries);

  // --- last feed block ---
  let lastFeedMarkup;
  if (!lastEntry) {
    lastFeedMarkup = `
      <section class="last-feed">
        <p class="last-feed__value"><span class="last-feed__number" style="font-size:44px;font-weight:400">עוד אין הנקות</span></p>
        <p class="empty-hint">כשמתחילים להניק מקישים על הצד. הטיימר רץ עד שמקישים על ״סיום ושמירה״, וגם אפשר להחליף צד באמצע.</p>
      </section>`;
  } else {
    const leadText = lastEntry.type === 'bottle' ? 'הבקבוק האחרון היה לפני' : 'ההנקה האחרונה התחילה לפני';
    const detailText = lastEntry.type === 'bottle'
      ? `ב־${formatClockTime(lastEntry.startMs)}, ${lastEntry.volumeMl} מ״ל`
      : `ב־${formatClockTime(lastEntry.startMs)}, ${describeSides(lastEntry.segments)}`;

    const todayEntries = entriesOnDay(appState.entries, startOfLocalDay(nowMs));
    const todayBreastfeedCount = todayEntries.filter(entry => entry.type === 'breast').length;
    const todayBottleCount = todayEntries.length - todayBreastfeedCount;
    let todayLine = todayBreastfeedCount === 0 ? 'היום: עוד אין הנקות' : `היום: ${formatBreastfeedCount(todayBreastfeedCount)}`;
    if (todayBottleCount > 0) todayLine += ` ו${formatBottleCount(todayBottleCount)}`;

    const recentAverageGapMs = computeRecentAverageGapMs(appState.entries, nowMs);
    const averageLine = recentAverageGapMs
      ? `<li>בשלושת הימים האחרונים: בממוצע כל ${formatGapForSentence(recentAverageGapMs)}</li>`
      : '';

    lastFeedMarkup = `
      <section class="last-feed" aria-live="off">
        <p class="last-feed__lead">${leadText}</p>
        <p class="last-feed__value">
          <span class="last-feed__number" data-live="since-number"></span>
          <span class="last-feed__unit" data-live="since-unit"></span>
        </p>
        <p class="last-feed__detail">${escapeHtml(detailText)}</p>
        <ul class="day-lines"><li>${todayLine}</li>${averageLine}</ul>
      </section>`;
  }

  // --- suggestion sentence ---
  let suggestionMarkup = '';
  if (suggestion) {
    const previousSidesText = suggestion.usedBothSides
      ? `${SIDE_LABEL[suggestion.sidesInOrder[0]]} ואז ${SIDE_LABEL[suggestion.sidesInOrder[1]]}`
      : SIDE_LABEL[suggestion.sidesInOrder[0]];
    suggestionMarkup = `<p class="suggestion">בפעם הקודמת: ${previousSidesText}. הפעם להתחיל <strong>${SIDE_LABEL_WITH_BET[suggestion.suggestedSide]}</strong>.</p>`;
  } else {
    suggestionMarkup = `<p class="suggestion">באיזה צד מתחילים?</p>`;
  }

  // --- dials ---
  const dialsMarkup = [SIDE.RIGHT, SIDE.LEFT].map(side => {
    const isSuggested = suggestion && suggestion.suggestedSide === side;
    const isLastSingleSide = suggestion && !suggestion.usedBothSides && suggestion.lastUsedSide === side;
    const subLabel = isSuggested ? 'להתחיל כאן' : (isLastSingleSide ? 'הצד האחרון' : 'להתחיל');
    return buildDialMarkup({
      side,
      stateClass: isSuggested ? 'is-suggested' : '',
      subLabel,
      showTimer: false,
      isRunning: false,
      ariaLabel: `להתחיל הנקה בצד ${SIDE_LABEL[side]}${isSuggested ? ' (מומלץ)' : ''}`,
    });
  }).join('');

  return `
    ${lastFeedMarkup}
    ${buildResumeCardMarkup(nowMs)}
    ${suggestionMarkup}
    <div class="dials">${dialsMarkup}</div>
    <div class="quick-actions">
      <button class="pill-button" type="button" data-action="open-bottle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4M10.5 2v3.2L8 8v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8l-2.5-2.8V2"/><path d="M8 13h8"/></svg>
        בקבוק
      </button>
      <button class="pill-button" type="button" data-action="open-manual-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        הוספת הנקה שלא נרשמה
      </button>
    </div>`;
}

function buildActiveFeedMarkup() {
  const session = appState.activeSession;
  const openSegment = getOpenSegment(session);
  const isPaused = !openSegment;
  const currentSide = getCurrentSide(session);

  const dialsMarkup = [SIDE.RIGHT, SIDE.LEFT].map(side => {
    const isRunningSide = !isPaused && side === currentSide;
    let subLabel;
    if (isRunningSide) subLabel = 'עכשיו';
    else if (isPaused) subLabel = side === currentSide ? 'להמשיך כאן' : 'להמשיך בצד הזה';
    else subLabel = 'להחליף לכאן';
    return buildDialMarkup({
      side,
      stateClass: isRunningSide ? 'is-running' : 'is-waiting',
      subLabel,
      showTimer: true,
      isRunning: isRunningSide,
      ariaLabel: isRunningSide ? `מניקה עכשיו בצד ${SIDE_LABEL[side]}` : `${isPaused ? 'להמשיך' : 'להחליף'} לצד ${SIDE_LABEL[side]}`,
    });
  }).join('');

  const stateText = isPaused
    ? 'בהשהיה. הקשה על צד ממשיכה את ההנקה.'
    : `עכשיו ${SIDE_LABEL_WITH_BET[currentSide]}. כדי להחליף צד מקישים על הצד השני.`;

  return `
    <section class="active-feed">
      <p class="active-feed__lead">ההנקה התחילה ב־<span class="numeric">${formatClockTime(session.startMs)}</span></p>
      <p class="active-feed__timer ${isPaused ? 'is-paused' : ''}" data-live="total-timer" aria-live="off"></p>
      <p class="active-feed__state">${stateText}</p>
      ${buildNightNoteMarkup()}
    </section>
    <div class="dials">${dialsMarkup}</div>
    <div class="controls">
      <button class="button button--secondary" type="button" data-action="${isPaused ? 'resume' : 'pause'}">${isPaused ? 'להמשיך' : 'השהיה'}</button>
      <button class="button button--primary" type="button" data-action="finish">סיום ושמירה</button>
    </div>
    <p class="long-feed-note" data-live="long-feed-note" hidden>ההנקה רצה כבר יותר משעה וחצי. אם שכחת לסיים, אפשר לסיים עכשיו ולתקן את המשך בהיסטוריה.</p>
    <button class="text-button" type="button" data-action="discard">ביטול ההנקה בלי לשמור</button>`;
}


/* =====================================================================
 * 11. RENDERING — history
 * ===================================================================== */

function renderHistoryScreen() {
  const nowMs = Date.now();
  if (appState.entries.length === 0) {
    elements.historyScreen.innerHTML = `
      <h2 class="screen-title">היסטוריה</h2>
      <p class="empty-state"><strong>עוד אין רישומים</strong>כל הנקה שנשמרת מופיעה כאן, מהחדשה לישנה. אפשר להקיש על רישום כדי לתקן אותו.</p>`;
    return;
  }

  // Previous entry for each entry (by time), to show the gap since the previous feed.
  const previousStartById = new Map();
  appState.entries.forEach((entry, index) => {
    if (index > 0) previousStartById.set(entry.id, appState.entries[index - 1].startMs);
  });

  // Group by day, newest day first.
  const entriesByDay = new Map();
  for (let index = appState.entries.length - 1; index >= 0; index -= 1) {
    const entry = appState.entries[index];
    const dayStartMs = startOfLocalDay(entry.startMs);
    if (!entriesByDay.has(dayStartMs)) entriesByDay.set(dayStartMs, []);
    entriesByDay.get(dayStartMs).push(entry);
  }

  const allDays = [...entriesByDay.keys()];
  const shownDays = allDays.slice(0, appState.historyDaysShown);

  const dayMarkups = shownDays.map(dayStartMs => {
    const dayEntries = entriesByDay.get(dayStartMs);
    const breastfeeds = dayEntries.filter(entry => entry.type === 'breast');
    const bottles = dayEntries.filter(entry => entry.type === 'bottle');
    const totalBreastMs = breastfeeds.reduce((sum, entry) => sum + totalFeedingMs(entry.segments), 0);
    let summaryText = breastfeeds.length ? `${formatBreastfeedCount(breastfeeds.length)}, ${formatDurationShort(totalBreastMs)}` : '';
    if (bottles.length) summaryText += `${summaryText ? ', ' : ''}${formatBottleCount(bottles.length)}`;

    const entryMarkups = dayEntries.map(entry => buildHistoryEntryMarkup(entry, previousStartById.get(entry.id))).join('');
    return `
      <section class="history-day">
        <div class="history-day__head">
          <h3 class="history-day__title">${formatDayHeading(dayStartMs, nowMs)}</h3>
          <p class="history-day__summary">${summaryText}</p>
        </div>
        ${entryMarkups}
      </section>`;
  }).join('');

  const moreButton = allDays.length > shownDays.length
    ? `<button class="button button--secondary button--block more-history" type="button" data-action="history-more">להציג ימים קודמים</button>`
    : '';

  elements.historyScreen.innerHTML = `<h2 class="screen-title">היסטוריה</h2>${dayMarkups}${moreButton}`;
}

function buildHistoryEntryMarkup(entry, previousStartMs) {
  const gapMarkup = previousStartMs
    ? `<span class="history-entry__gap">${formatDurationShort(entry.startMs - previousStartMs)} אחרי הקודמת</span>`
    : '';

  if (entry.type === 'bottle') {
    return `
      <button class="history-entry" type="button" data-action="edit-entry" data-entry-id="${entry.id}">
        <span class="history-entry__time">${formatClockTime(entry.startMs)}</span>
        <span><span class="history-entry__what"><span class="bottle-dot" aria-hidden="true"></span>בקבוק</span>${gapMarkup}</span>
        <span class="history-entry__total">${entry.volumeMl} מ״ל</span>
      </button>`;
  }

  // A small bar split by side, in the order the sides were used (right on the right).
  const totalsBySide = sumDurationsBySide(entry.segments);
  const totalMs = totalsBySide.R + totalsBySide.L;
  const barWidthPercent = Math.min(100, (totalMs / SPLIT_BAR_FULL_SCALE_MS) * 100);
  const barParts = [SIDE.RIGHT, SIDE.LEFT]
    .filter(side => totalsBySide[side] > 0)
    .map(side => `<span class="${side === SIDE.RIGHT ? 'mark-right' : 'mark-left'}" style="flex-grow:${totalsBySide[side]}"></span>`)
    .join('');

  return `
    <button class="history-entry" type="button" data-action="edit-entry" data-entry-id="${entry.id}">
      <span class="history-entry__time">${formatClockTime(entry.startMs)}</span>
      <span>
        <span class="history-entry__what">${escapeHtml(describeSides(entry.segments))}</span>
        <span class="split-bar" style="width:${barWidthPercent.toFixed(1)}%" aria-hidden="true">${barParts}</span>
        ${gapMarkup}
      </span>
      <span class="history-entry__total">${formatMinutesShort(totalMs)}</span>
    </button>`;
}


/* =====================================================================
 * 12. RENDERING — insights
 * ===================================================================== */

function renderInsightsScreen() {
  const nowMs = Date.now();
  const insights = computeInsights(appState.entries, appState.insightsRangeDays, nowMs);

  const rangeSwitchMarkup = `
    <div class="range-switch" role="group" aria-label="טווח זמן">
      ${INSIGHTS_RANGE_OPTIONS.map(days => `
        <button type="button" data-action="set-range" data-days="${days}" aria-pressed="${days === appState.insightsRangeDays}">${days} ימים</button>`).join('')}
    </div>`;

  if (insights.isEmpty || insights.entriesInRange.length < 2) {
    elements.insightsScreen.innerHTML = `
      <h2 class="screen-title">תובנות</h2>
      ${rangeSwitchMarkup}
      <p class="empty-state"><strong>עוד מעט יהיה כאן מה לראות</strong>אחרי כמה הנקות יופיעו כאן כמה הנקות יש ביום, כמה זמן עובר ביניהן, איך הצדדים מתחלקים ובאילו שעות הן קורות.</p>`;
    return;
  }

  elements.insightsScreen.innerHTML = `
    <h2 class="screen-title">תובנות</h2>
    ${rangeSwitchMarkup}
    ${buildSummaryListMarkup(insights)}
    ${buildSideBalanceMarkup(insights)}
    <section class="chart-section">
      <h2>מתי היו ההנקות</h2>
      <p class="chart-note">כל שורה היא יום, משעה 00:00 משמאל ועד 24:00 מימין. הקשה על הנקה מציגה את הפרטים.</p>
      <ul class="legend">
        <li><span class="swatch mark-right"></span>ימין</li>
        <li><span class="swatch mark-left"></span>שמאל</li>
        ${insights.bottleCount ? '<li><span class="swatch swatch-bottle mark-bottle"></span>בקבוק</li>' : ''}
        <li><span class="swatch swatch-night"></span>לילה (22:00 עד 06:00)</li>
      </ul>
      <div class="chart" data-chart="timeline"></div>
    </section>
    <section class="chart-section">
      <h2>הנקות בכל יום</h2>
      <p class="chart-note">היום עדיין לא נגמר, ולכן העמודה שלו בהירה יותר.</p>
      <div class="chart" data-chart="feeds-per-day"></div>
    </section>
    <section class="chart-section">
      <h2>ההפסקה הארוכה ביותר בכל יום</h2>
      <p class="chart-note">הזמן הארוך ביותר בין תחילת האכלה לתחילת הבאה, לפי היום שבו ההפסקה הסתיימה. עמודות שעולות לאורך זמן אומרות שהתינוק מחזיק יותר בין האכלות.</p>
      <div class="chart" data-chart="longest-gap"></div>
    </section>`;

  drawInsightsCharts(insights, nowMs);
}

function buildSummaryListMarkup(insights) {
  const rows = [];

  if (insights.averageBreastfeedsPerDay != null) {
    rows.push(['הנקות ביום, בממוצע', insights.averageBreastfeedsPerDay.toFixed(1),
      `לפי ${insights.averagingDayCount === 1 ? 'יום שלם אחד' : `${insights.averagingDayCount} ימים שלמים`}`]);
  } else if (insights.todayBucket) {
    rows.push(['הנקות היום עד עכשיו', String(insights.todayBucket.breastfeeds.length), '']);
  }
  if (insights.averageGapMs != null) {
    rows.push(['זמן בין האכלות, בממוצע', `${formatHoursMinutes(insights.averageGapMs)} שע׳`, 'מתחילת האכלה לתחילת הבאה']);
  }
  if (insights.averageBreastfeedMs != null) {
    rows.push(['משך הנקה, בממוצע', formatMinutesShort(insights.averageBreastfeedMs), '']);
  }
  if (insights.longestInterval) {
    const interval = insights.longestInterval;
    rows.push(['ההפסקה הארוכה ביותר', `${formatHoursMinutes(interval.gapMs)} שע׳`,
      `${formatChartDayLabel(startOfLocalDay(interval.fromMs), Date.now())}, מ־${formatClockTime(interval.fromMs)} עד ${formatClockTime(interval.toMs)}`]);
  }
  if (insights.averageNightFeedsPerDay != null) {
    rows.push(['האכלות בלילה, בממוצע', insights.averageNightFeedsPerDay.toFixed(1), 'בין 22:00 ל־06:00']);
  }
  if (insights.busiestWindow) {
    const busiestWindow = insights.busiestWindow;
    rows.push(['השעות העמוסות ביותר', `${padTwoDigits(busiestWindow.startHour)}:00 עד ${padTwoDigits(busiestWindow.endHour)}:00`,
      `${Math.round(busiestWindow.share * 100)}% מההאכלות`]);
  }
  if (insights.bottleCount > 0) {
    rows.push(['בקבוקים', formatBottleCount(insights.bottleCount), `${insights.bottleTotalMl} מ״ל בסך הכול`]);
  }

  return `
    <dl class="summary-list">
      ${rows.map(([label, value, note]) => `
        <div class="summary-row">
          <dt>${label}</dt>

/* =====================================================================
 * 13. CHARTS — hand-built SVG (no libraries, works offline)
 * Charts use a left-to-right time axis, like graphs in a math notebook.
 * ===================================================================== */

/** Day-by-day timeline: one row per day (newest on top), 00:00 → 24:00 left to right. */
function buildTimelineSvg(insights, nowMs, widthPx) {
  const rowHeightPx = 22;
  const barHeightPx = 10;
  const axisHeightPx = 18;
  const dayLabelColumnPx = 60;
  const plotLeftPx = 2;
  const plotRightPx = widthPx - dayLabelColumnPx;
  const plotWidthPx = plotRightPx - plotLeftPx;
  const rows = [...insights.dayBuckets].reverse();
  const heightPx = axisHeightPx + rows.length * rowHeightPx + 2;
  const plotTopPx = axisHeightPx;
  const plotBottomPx = heightPx - 2;

  const xForHour = hour => plotLeftPx + (hour / 24) * plotWidthPx;
  const parts = [];

  // Night shading (00:00–06:00 and 22:00–24:00) and hour grid lines.
  parts.push(`<rect class="night-band" x="${xForHour(0)}" y="${plotTopPx}" width="${xForHour(NIGHT_END_HOUR) - xForHour(0)}" height="${plotBottomPx - plotTopPx}"/>`);
  parts.push(`<rect class="night-band" x="${xForHour(NIGHT_START_HOUR)}" y="${plotTopPx}" width="${xForHour(24) - xForHour(NIGHT_START_HOUR)}" height="${plotBottomPx - plotTopPx}"/>`);
  for (const hour of [0, 6, 12, 18, 24]) {
    const x = xForHour(hour);
    parts.push(`<line class="grid-line" x1="${x}" x2="${x}" y1="${plotTopPx}" y2="${plotBottomPx}"/>`);
    const anchor = hour === 0 ? 'start' : hour === 24 ? 'end' : 'middle';
    parts.push(`<text x="${x}" y="12" text-anchor="${anchor}">${padTwoDigits(hour)}:00</text>`);
  }

  // Every breast segment and bottle in range (plus the feed just before the range, for spill-over past midnight).
  const firstRangeIndex = appState.entries.findIndex(entry => entry.startMs >= insights.dayBuckets[0].dayStartMs);
  const sourceEntries = firstRangeIndex > 0 ? appState.entries.slice(firstRangeIndex - 1) : insights.entriesInRange;

  rows.forEach((bucket, rowIndex) => {
    const rowTopPx = plotTopPx + rowIndex * rowHeightPx;
    const barTopPx = rowTopPx + (rowHeightPx - barHeightPx) / 2;
    const dayLengthMs = bucket.nextDayStartMs - bucket.dayStartMs;
    const xForTimestamp = timestampMs => plotLeftPx + ((timestampMs - bucket.dayStartMs) / dayLengthMs) * plotWidthPx;

    parts.push(`<text class="label-strong" x="${widthPx - 2}" y="${rowTopPx + rowHeightPx / 2 + 4}" text-anchor="end">${formatChartDayLabel(bucket.dayStartMs, nowMs)}</text>`);

    const hitAreas = [];
    for (const entry of sourceEntries) {
      if (entry.type === 'bottle') {
        if (entry.startMs < bucket.dayStartMs || entry.startMs >= bucket.nextDayStartMs) continue;
        const x = xForTimestamp(entry.startMs);
        parts.push(`<circle class="fill-bottle" cx="${x.toFixed(1)}" cy="${rowTopPx + rowHeightPx / 2}" r="4.5"/>`);
        hitAreas.push({ fromPx: x - 5, toPx: x + 5, tip: `${formatClockTime(entry.startMs)}, בקבוק ${entry.volumeMl} מ״ל` });
        continue;
      }
      if (entry.endMs <= bucket.dayStartMs || entry.startMs >= bucket.nextDayStartMs) continue;
      for (const segment of entry.segments) {
        const clippedStartMs = Math.max(segment.startMs, bucket.dayStartMs);
        const clippedEndMs = Math.min(segment.endMs, bucket.nextDayStartMs);
        if (clippedEndMs <= clippedStartMs) continue;
        const x1 = xForTimestamp(clippedStartMs);
        const widthOfSegmentPx = Math.max(3, xForTimestamp(clippedEndMs) - x1);
        parts.push(`<rect class="${segment.side === SIDE.RIGHT ? 'fill-right' : 'fill-left'}" x="${x1.toFixed(1)}" y="${barTopPx}" width="${widthOfSegmentPx.toFixed(1)}" height="${barHeightPx}" rx="2"/>`);
      }
      const entryStartPx = xForTimestamp(Math.max(entry.startMs, bucket.dayStartMs));
      const entryEndPx = xForTimestamp(Math.min(entry.endMs, bucket.nextDayStartMs));
      hitAreas.push({
        fromPx: entryStartPx,
        toPx: Math.max(entryEndPx, entryStartPx + 3),
        tip: `${formatClockTime(entry.startMs)}, ${describeSides(entry.segments)}`,
      });
    }

    // Generous invisible tap targets on top of the small marks.
    for (const hitArea of hitAreas) {
      const centerPx = (hitArea.fromPx + hitArea.toPx) / 2;
      const hitWidthPx = Math.max(18, hitArea.toPx - hitArea.fromPx + 8);
      parts.push(`<rect class="hit-area" x="${(centerPx - hitWidthPx / 2).toFixed(1)}" y="${rowTopPx}" width="${hitWidthPx.toFixed(1)}" height="${rowHeightPx}" data-tip="${escapeHtml(hitArea.tip)}"/>`);
    }
  });

  return `<svg viewBox="0 0 ${widthPx} ${heightPx}" width="${widthPx}" height="${heightPx}" direction="ltr" role="img" aria-label="ההנקות בכל יום לפי שעה">${parts.join('')}</svg>`;
}

/** Bar with rounded top corners, anchored to the baseline. */
function roundedTopBarPath(x, yTop, width, height, radius) {
  const r = Math.min(radius, width / 2, height);
  return `M${x},${yTop + height}V${yTop + r}Q${x},${yTop} ${x + r},${yTop}H${x + width - r}Q${x + width},${yTop} ${x + width},${yTop + r}V${yTop + height}Z`;
}

/** One bar per day; values on a single axis with tick labels on the right edge. */
function buildDailyBarChartSvg({ dayBuckets, nowMs, widthPx, valueForDay, tickStep, formatTick, tooltipForDay, ariaLabel }) {
  const heightPx = 150;
  const topPx = 10;
  const bottomAxisPx = 22;
  const tickLabelColumnPx = 40;
  const plotLeftPx = 2;
  const plotRightPx = widthPx - tickLabelColumnPx;
  const plotBottomPx = heightPx - bottomAxisPx;
  const plotHeightPx = plotBottomPx - topPx;
  const plotWidthPx = plotRightPx - plotLeftPx;

  const values = dayBuckets.map(valueForDay);
  const maxValue = Math.max(tickStep, ...values);
  let step = tickStep;
  while (Math.ceil(maxValue / step) > 4) step *= 2;
  const axisMax = Math.ceil(maxValue / step) * step;
  const yForValue = value => plotBottomPx - (value / axisMax) * plotHeightPx;

  const parts = [];
  for (let tick = 0; tick <= axisMax; tick += step) {
    const y = yForValue(tick);
    parts.push(`<line class="grid-line" x1="${plotLeftPx}" x2="${plotRightPx}" y1="${y}" y2="${y}"/>`);
    parts.push(`<text x="${widthPx - 2}" y="${y + 4}" text-anchor="end">${formatTick(tick)}</text>`);
  }

  const dayCount = dayBuckets.length;
  const bandWidthPx = plotWidthPx / dayCount;
  const barWidthPx = Math.min(26, bandWidthPx * 0.64);
  // Label every day for a week; otherwise every few days, always including the newest.
  const labelEvery = dayCount <= 7 ? 1 : dayCount <= 14 ? 2 : 5;

  dayBuckets.forEach((bucket, index) => {
    const value = values[index];
    const bandLeftPx = plotLeftPx + index * bandWidthPx;
    const barLeftPx = bandLeftPx + (bandWidthPx - barWidthPx) / 2;
    if (value > 0) {
      const barTopPx = yForValue(value);
      parts.push(`<path class="fill-neutral${bucket.isToday ? ' is-partial' : ''}" d="${roundedTopBarPath(barLeftPx, barTopPx, barWidthPx, plotBottomPx - barTopPx, 4)}"/>`);
    }
    const distanceFromNewest = dayCount - 1 - index;
    if (distanceFromNewest % labelEvery === 0) {
      const label = dayCount <= 7
        ? (bucket.isToday ? 'היום' : WEEKDAY_LETTERS[new Date(bucket.dayStartMs).getDay()])
        : (bucket.isToday ? 'היום' : formatDayMonth(bucket.dayStartMs));
      parts.push(`<text x="${(bandLeftPx + bandWidthPx / 2).toFixed(1)}" y="${heightPx - 6}" text-anchor="middle">${label}</text>`);
    }
    parts.push(`<rect class="hit-area" x="${bandLeftPx.toFixed(1)}" y="${topPx}" width="${bandWidthPx.toFixed(1)}" height="${plotHeightPx}" data-tip="${escapeHtml(tooltipForDay(bucket))}"/>`);
  });

  return `<svg viewBox="0 0 ${widthPx} ${heightPx}" width="${widthPx}" height="${heightPx}" direction="ltr" role="img" aria-label="${escapeHtml(ariaLabel)}">${parts.join('')}</svg>`;
}

/* --- chart tooltip (tap to show; works with touch) --- */
function showChartTooltip(text, clientX, clientY) {
  const tooltip = elements.chartTooltip;
  tooltip.textContent = text;
  tooltip.hidden = false;
  const tooltipRect = tooltip.getBoundingClientRect();
  const left = Math.min(window.innerWidth - tooltipRect.width - 8, Math.max(8, clientX - tooltipRect.width / 2));
  const top = clientY - tooltipRect.height - 14 < 8 ? clientY + 18 : clientY - tooltipRect.height - 14;
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
}

function hideChartTooltip() {
  elements.chartTooltip.hidden = true;
}

/** Add (no entry) or edit (existing entry) a breastfeed. */
function openBreastfeedSheet(existingEntry) {
  const nowMs = Date.now();
  const suggestion = computeSideSuggestion(appState.entries);
  let startMs;
  let minutesBySide;
  let firstSide;

  if (existingEntry) {
    const totalsBySide = sumDurationsBySide(existingEntry.segments);
    startMs = existingEntry.startMs;
    minutesBySide = { R: Math.round(totalsBySide.R / MS_PER_MINUTE), L: Math.round(totalsBySide.L / MS_PER_MINUTE) };
    firstSide = getSidesInOrderOfUse(existingEntry.segments)[0];
  } else {
    firstSide = suggestion ? suggestion.suggestedSide : SIDE.RIGHT;
    startMs = nowMs - 30 * MS_PER_MINUTE;
    minutesBySide = { R: 0, L: 0 };
    minutesBySide[firstSide] = 15;
  }

  openSheet(`
    <form id="breastfeed-form" data-form="breastfeed" data-entry-id="${existingEntry ? existingEntry.id : ''}" novalidate>
      <h2 id="sheet-title">${existingEntry ? 'עריכת הנקה' : 'הוספת הנקה'}</h2>

      <div class="field">
        <label for="start-input">מתי התחילה</label>

      <div class="field">
        ${buildStepperMarkup({ name: 'minutesL', value: minutesBySide.L, step: 1, max: 180, unit: 'דק׳', label: 'שמאל', swatchClass: 'mark-left' })}

    </form>`);
}

function handleBreastfeedFormSubmit(form) {
  const originalEntry = form.dataset.entryId ? findEntryById(form.dataset.entryId) : null;
  const startMs = readStartTimeFromForm(form, originalEntry);
  const minutesBySide = {
    R: clampInteger(form.elements.minutesR.value, 0, 180),
    L: clampInteger(form.elements.minutesL.value, 0, 180),
  };
  const checkedFirstSide = form.querySelector('input[name="firstSide"]:checked');
  let firstSide = checkedFirstSide ? checkedFirstSide.value : SIDE.RIGHT;
  if (minutesBySide[firstSide] === 0) firstSide = oppositeSide(firstSide);

  if (!Number.isFinite(startMs)) return showFormError(form, 'צריך לבחור מתי ההנקה התחילה.');
  if (startMs > Date.now() + MS_PER_MINUTE) return showFormError(form, 'השעה שנבחרה עוד לא הגיעה.');
  if (minutesBySide.R + minutesBySide.L === 0) return showFormError(form, 'צריך לפחות דקה אחת באחד הצדדים.');

  const segments = buildBreastSegmentsFromForm({ startMs, minutesBySide, firstSide, originalEntry });
  upsertEntry({
    id: originalEntry ? originalEntry.id : createEntryId(),
    type: 'breast',
    startMs,
    endMs: segments[segments.length - 1].endMs,
    segments,
  });
  closeSheet();
  renderAll();
  showToast(originalEntry ? 'השינויים נשמרו' : 'ההנקה נשמרה');
}

function handleBottleFormSubmit(form) {
  const originalEntry = form.dataset.entryId ? findEntryById(form.dataset.entryId) : null;
  const startMs = readStartTimeFromForm(form, originalEntry);
  const volumeMl = clampInteger(form.elements.volumeMl.value, 0, 400);

  if (!Number.isFinite(startMs)) return showFormError(form, 'צריך לבחור מתי.');
  if (startMs > Date.now() + 2 * MS_PER_MINUTE) return showFormError(form, 'השעה שנבחרה עוד לא הגיעה.');
  if (volumeMl <= 0) return showFormError(form, 'צריך כמות גדולה מאפס.');

  upsertEntry({
    id: originalEntry ? originalEntry.id : createEntryId(),
    type: 'bottle',
    startMs,
    volumeMl,
  });
  requestPersistentStorageOnce();
  closeSheet();
  renderAll();
  showToast(originalEntry ? 'השינויים נשמרו' : 'הבקבוק נשמר');
}

/** Shares the file when the phone supports it (WhatsApp, Drive…); otherwise downloads it. */
async function shareOrDownloadFile(blob, fileName, shareTitle) {
  const file = new File([blob], fileName, { type: blob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: shareTitle });
      return true;
    }
  } catch (error) {
    if (error && error.name === 'AbortError') return false; // user closed the share sheet
    // Any other share failure: fall back to a download below.
  }
  const objectUrl = URL.createObjectURL(blob);
  const downloadLink = document.createElement('a');
  downloadLink.href = objectUrl;
  downloadLink.download = fileName;
  document.body.appendChild(downloadLink);
  downloadLink.click();
  downloadLink.remove();
  window.setTimeout(() => URL.revokeObjectURL(objectUrl), 5000);
  return true;
}

async function exportBackupJson() {
  const payload = {
    app: 'feeding-tracker',
    formatVersion: 1,
    exportedAt: new Date().toISOString(),
    entries: appState.entries,
    meals: appState.meals,
    settings: { babyName: appState.babyName },
  };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const delivered = await shareOrDownloadFile(blob, `feeding-backup-${formatDateStamp(Date.now())}.json`, 'גיבוי הנקות');
  if (!delivered) return;
  storage.writeJson(STORAGE_KEYS.lastBackupMs, Date.now());
  renderBackupReminderDot();
  if (elements.sheet.open) openBackupSheet();
  showToast('קובץ הגיבוי נשמר');
}

function toCsvField(value) {
  const text = String(value);
  return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

async function exportCsv() {
  const headerRow = ['תאריך', 'שעת התחלה', 'שעת סיום', 'סוג', 'צד ראשון', 'דקות ימין', 'דקות שמאל', 'סך הכול דקות', 'מ״ל',
    'מאכלים', 'כמות', 'אהבה?', 'תגובה'];
  const allRecords = [...appState.entries, ...appState.meals.map(meal => ({ ...meal, type: 'meal' }))]
    .sort((first, second) => first.startMs - second.startMs);
  const dataRows = allRecords.map(entry => {
    const date = new Date(entry.startMs);
    const dateText = `${padTwoDigits(date.getDate())}/${padTwoDigits(date.getMonth() + 1)}/${date.getFullYear()}`;
    if (entry.type === 'meal') {
      return [dateText, formatClockTime(entry.startMs), '', 'אוכל', '', '', '', '', '',
        entry.foods.join(' / '), entry.amount ? MEAL_AMOUNTS[entry.amount] : '',
        entry.liking ? MEAL_LIKINGS[entry.liking].label : '', entry.reaction || ''];
    }
    if (entry.type === 'bottle') {
      return [dateText, formatClockTime(entry.startMs), '', 'בקבוק', '', '', '', '', entry.volumeMl, '', '', '', ''];
    }
    const totalsBySide = sumDurationsBySide(entry.segments);
    const toMinutes = durationMs => (durationMs / MS_PER_MINUTE).toFixed(1);
    return [
      dateText, formatClockTime(entry.startMs), formatClockTime(entry.endMs), 'הנקה',
      SIDE_LABEL[getSidesInOrderOfUse(entry.segments)[0]],
      toMinutes(totalsBySide.R), toMinutes(totalsBySide.L), toMinutes(totalsBySide.R + totalsBySide.L), '', '', '', '', '',
    ];
  });
  // The BOM makes Excel open Hebrew UTF-8 correctly.
  const csvText = '﻿' + [headerRow, ...dataRows].map(row => row.map(toCsvField).join(',')).join('\r\n');
  const blob = new Blob([csvText], { type: 'text/csv' });
  const delivered = await shareOrDownloadFile(blob, `feeding-log-${formatDateStamp(Date.now())}.csv`, 'יומן הנקות');
  if (delivered) showToast('הקובץ מוכן');
}

async function importBackupFile(file) {
  let parsedBackup;
  try {
    parsedBackup = JSON.parse(await file.text());
  } catch (error) {
    showToast('הקובץ הזה הוא לא קובץ גיבוי של האפליקציה');
    return;
  }
  const candidateEntries = Array.isArray(parsedBackup) ? parsedBackup : (parsedBackup && parsedBackup.entries);
  const validEntries = Array.isArray(candidateEntries) ? candidateEntries.filter(isValidEntry) : [];
  const candidateMeals = parsedBackup && !Array.isArray(parsedBackup) ? parsedBackup.meals : null;
  const validMeals = Array.isArray(candidateMeals) ? candidateMeals.filter(isValidMeal) : [];
  const validCount = validEntries.length + validMeals.length;
  if (validCount === 0) {
    showToast('לא נמצאו רישומים בקובץ הזה');
    return;
  }
  const existingEntryIds = new Set(appState.entries.map(entry => entry.id));
  const existingMealIds = new Set(appState.meals.map(meal => meal.id));
  const newEntries = validEntries.filter(entry => !existingEntryIds.has(entry.id));
  const newMeals = validMeals.filter(meal => !existingMealIds.has(meal.id));
  const newCount = newEntries.length + newMeals.length;
  if (newCount === 0) {
    showToast('כל הרישומים שבקובץ כבר נמצאים כאן');
    return;
  }
  const confirmed = window.confirm(`בקובץ יש ${validCount} רישומים, ${newCount} מהם חדשים. להוסיף אותם?`);
  if (!confirmed) return;
  appState.entries.push(...newEntries);
  appState.meals.push(...newMeals);
  const backupName = parsedBackup && parsedBackup.settings && parsedBackup.settings.babyName;
  if (!appState.babyName && typeof backupName === 'string' && backupName.trim()) {
    appState.babyName = backupName.trim().slice(0, MAX_BABY_NAME_LENGTH);
    storage.writeJson(STORAGE_KEYS.babyName, appState.babyName);
  }
  saveEntries();
  saveMeals();
  closeSheet();
  renderAll();
  showToast(`נוספו ${newCount} רישומים`);
}

function clearAllData() {
  if (!window.confirm('למחוק את כל הרישומים מהטלפון הזה? אי אפשר לבטל את זה.')) return;
  if (!window.confirm('בטוח? כדאי לשמור קובץ גיבוי לפני כן.')) return;
  appState.entries = [];
  appState.meals = [];
  appState.activeSession = null;
  saveEntries();
  saveMeals();
  saveActiveSession();
  closeSheet();
  renderAll();
  showToast('כל הרישומים נמחקו');
}

 * 16a. SOLID FOOD — statistics
 * ===================================================================== */

/**
 * Per-food and per-allergen statistics over all meals.
 * statsByFood: name → { tries, firstMs, firstMealId, lastLiking, hadReaction }
 * statsByAllergen: key → { tries, firstMs, hadReaction }
 */
function computeFoodStats(meals, { excludeMealId = null } = {}) {
  const statsByFood = new Map();
  const statsByAllergen = new Map();
  for (const meal of meals) {
    if (meal.id === excludeMealId) continue;
    for (const foodName of meal.foods) {
      if (!statsByFood.has(foodName)) {
        statsByFood.set(foodName, { tries: 0, firstMs: meal.startMs, firstMealId: meal.id, lastLiking: null, hadReaction: false });
      }
      const foodStats = statsByFood.get(foodName);
      foodStats.tries += 1;
      if (meal.liking) foodStats.lastLiking = meal.liking;
      if (meal.reaction) foodStats.hadReaction = true;

      const allergenKey = FOOD_TO_ALLERGEN[foodName];
      if (allergenKey) {
        if (!statsByAllergen.has(allergenKey)) statsByAllergen.set(allergenKey, { tries: 0, firstMs: meal.startMs, hadReaction: false });
        const allergenStats = statsByAllergen.get(allergenKey);
        allergenStats.tries += 1;
        if (meal.reaction) allergenStats.hadReaction = true;
      }
    }
  }
  return { statsByFood, statsByAllergen };
}

/** Foods tried that are not in the built-in catalog (typed by hand). */
function getCustomFoodNames(statsByFood) {
  return [...statsByFood.keys()].filter(foodName => !CATALOG_FOOD_NAMES.has(foodName));
}

function formatMealCount(count) {
  return count === 1 ? 'ארוחה אחת' : `${count} ארוחות`;
}

function formatFoodCount(count) {
  return count === 1 ? 'מאכל אחד' : `${count} מאכלים`;
}

function renderFoodScreen() {

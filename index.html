function buildSummaryListMarkup(insights) {
  const rows = [];

  if (insights.averageBreastfeedsPerDay != null) {
    rows.push(['הנקות ביום, בממוצע', insights.averageBreastfeedsPerDay.toFixed(1),
      `לפי ${insights.averagingDayCount === 1 ? 'יום שלם אחד' : `${insights.averagingDayCount} ימים שלמים`}`]);
  } else if (insights.todayBucket) {
    rows.push(['הנקות היום עד עכשיו', String(insights.todayBucket.breastfeeds.length), '']);
  }
  if (insights.averageGapMs != null) {
    rows.push(['זמן בין האכלות, בממוצע', `${formatHoursMinutes(insights.averageGapMs)} שע׳`, 'מתחילת האכלה לתחילת הבאה']);
  }
  if (insights.averageBreastfeedMs != null) {
    rows.push(['משך הנקה, בממוצע', formatMinutesShort(insights.averageBreastfeedMs), '']);
  }
  if (insights.longestInterval) {
    const interval = insights.longestInterval;
    rows.push(['ההפסקה הארוכה ביותר', `${formatHoursMinutes(interval.gapMs)} שע׳`,
      `${formatChartDayLabel(startOfLocalDay(interval.fromMs), Date.now())}, מ־${formatClockTime(interval.fromMs)} עד ${formatClockTime(interval.toMs)}`]);
  }
  if (insights.averageNightFeedsPerDay != null) {
    rows.push(['האכלות בלילה, בממוצע', insights.averageNightFeedsPerDay.toFixed(1), 'בין 22:00 ל־06:00']);
  }
  if (insights.busiestWindow) {
    const busiestWindow = insights.busiestWindow;
    rows.push(['השעות העמוסות ביותר', `${padTwoDigits(busiestWindow.startHour)}:00 עד ${padTwoDigits(busiestWindow.endHour)}:00`,
      `${Math.round(busiestWindow.share * 100)}% מההאכלות`]);
  }
  if (insights.bottleCount > 0) {
    rows.push(['בקבוקים', formatBottleCount(insights.bottleCount), `${insights.bottleTotalMl} מ״ל בסך הכול`]);
  }

  return `
    <dl class="summary-list">
      ${rows.map(([label, value, note]) => `
        <div class="summary-row">
          <dt>${label}</dt>
          <dd><span class="numeric">${escapeHtml(value)}</span>${note ? `<small>${escapeHtml(note)}</small>` : ''}</dd>
        </div>`).join('')}
    </dl>`;
}

function buildSideBalanceMarkup(insights) {
  const { R: rightMs, L: leftMs } = insights.sideTotalsMs;
  const totalMs = rightMs + leftMs;
  if (totalMs <= 0) return '';
  const rightPercent = Math.round((rightMs / totalMs) * 100);
  const leftPercent = 100 - rightPercent;
  return `
    <section class="chart-section">
      <h2>חלוקה בין הצדדים</h2>
      <p class="chart-note">כמה זמן הנקה היה בכל צד בטווח שנבחר.</p>
      <div class="balance">
        <div class="balance__bar" aria-hidden="true">
          <span class="mark-right" style="flex-grow:${rightMs}"></span>
          <span class="mark-left" style="flex-grow:${leftMs}"></span>
        </div>
        <div class="balance__labels">
          <div>ימין <span class="numeric">${rightPercent}%</span><small>${formatDurationShort(rightMs)}</small></div>
          <div>שמאל <span class="numeric">${leftPercent}%</span><small>${formatDurationShort(leftMs)}</small></div>
        </div>
      </div>
    </section>`;
}

/** Charts are drawn after the markup is in the page, so they can use the real container width. */
function drawInsightsCharts(insights, nowMs) {
  const timelineContainer = elements.insightsScreen.querySelector('[data-chart="timeline"]');
  const feedsContainer = elements.insightsScreen.querySelector('[data-chart="feeds-per-day"]');
  const gapContainer = elements.insightsScreen.querySelector('[data-chart="longest-gap"]');

  timelineContainer.innerHTML = buildTimelineSvg(insights, nowMs, timelineContainer.clientWidth || 340);

  feedsContainer.innerHTML = buildDailyBarChartSvg({
    dayBuckets: insights.dayBuckets,
    nowMs,
    widthPx: feedsContainer.clientWidth || 340,
    valueForDay: bucket => bucket.breastfeeds.length,
    tickStep: 2,
    formatTick: value => String(value),
    tooltipForDay: bucket => `${formatChartDayLabel(bucket.dayStartMs, nowMs)}: ${formatBreastfeedCount(bucket.breastfeeds.length)}${bucket.isToday ? ' עד עכשיו' : ''}`,
    ariaLabel: 'מספר ההנקות בכל יום',
  });

  gapContainer.innerHTML = buildDailyBarChartSvg({
    dayBuckets: insights.dayBuckets,
    nowMs,
    widthPx: gapContainer.clientWidth || 340,
    valueForDay: bucket => bucket.longestGapMs / MS_PER_HOUR,
    tickStep: 1,
    formatTick: value => `${value} שע׳`,
    tooltipForDay: bucket => bucket.longestGapMs
      ? `${formatChartDayLabel(bucket.dayStartMs, nowMs)}: ${formatHoursMinutes(bucket.longestGapMs)} שעות`
      : `${formatChartDayLabel(bucket.dayStartMs, nowMs)}: אין נתונים`,
    ariaLabel: 'ההפסקה הארוכה ביותר בכל יום, בשעות',
  });
}


/* =====================================================================
 * 13. CHARTS — hand-built SVG (no libraries, works offline)
 * Charts use a left-to-right time axis, like graphs in a math notebook.
 * ===================================================================== */

/** Day-by-day timeline: one row per day (newest on top), 00:00 → 24:00 left to right. */
function buildTimelineSvg(insights, nowMs, widthPx) {
  const rowHeightPx = 22;
  const barHeightPx = 10;
  const axisHeightPx = 18;
  const dayLabelColumnPx = 60;
  const plotLeftPx = 2;
  const plotRightPx = widthPx - dayLabelColumnPx;
  const plotWidthPx = plotRightPx - plotLeftPx;
  const rows = [...insights.dayBuckets].reverse();
  const heightPx = axisHeightPx + rows.length * rowHeightPx + 2;
  const plotTopPx = axisHeightPx;
  const plotBottomPx = heightPx - 2;

  const xForHour = hour => plotLeftPx + (hour / 24) * plotWidthPx;
  const parts = [];

  // Night shading (00:00–06:00 and 22:00–24:00) and hour grid lines.
  parts.push(`<rect class="night-band" x="${xForHour(0)}" y="${plotTopPx}" width="${xForHour(NIGHT_END_HOUR) - xForHour(0)}" height="${plotBottomPx - plotTopPx}"/>`);
  parts.push(`<rect class="night-band" x="${xForHour(NIGHT_START_HOUR)}" y="${plotTopPx}" width="${xForHour(24) - xForHour(NIGHT_START_HOUR)}" height="${plotBottomPx - plotTopPx}"/>`);
  for (const hour of [0, 6, 12, 18, 24]) {
    const x = xForHour(hour);
    parts.push(`<line class="grid-line" x1="${x}" x2="${x}" y1="${plotTopPx}" y2="${plotBottomPx}"/>`);
    const anchor = hour === 0 ? 'start' : hour === 24 ? 'end' : 'middle';
    parts.push(`<text x="${x}" y="12" text-anchor="${anchor}">${padTwoDigits(hour)}:00</text>`);
  }

  // Every breast segment and bottle in range (plus the feed just before the range, for spill-over past midnight).
  const firstRangeIndex = appState.entries.findIndex(entry => entry.startMs >= insights.dayBuckets[0].dayStartMs);
  const sourceEntries = firstRangeIndex > 0 ? appState.entries.slice(firstRangeIndex - 1) : insights.entriesInRange;

  rows.forEach((bucket, rowIndex) => {
    const rowTopPx = plotTopPx + rowIndex * rowHeightPx;
    const barTopPx = rowTopPx + (rowHeightPx - barHeightPx) / 2;
    const dayLengthMs = bucket.nextDayStartMs - bucket.dayStartMs;
    const xForTimestamp = timestampMs => plotLeftPx + ((timestampMs - bucket.dayStartMs) / dayLengthMs) * plotWidthPx;

    parts.push(`<text class="label-strong" x="${widthPx - 2}" y="${rowTopPx + rowHeightPx / 2 + 4}" text-anchor="end">${formatChartDayLabel(bucket.dayStartMs, nowMs)}</text>`);

    const hitAreas = [];
    for (const entry of sourceEntries) {
      if (entry.type === 'bottle') {
        if (entry.startMs < bucket.dayStartMs || entry.startMs >= bucket.nextDayStartMs) continue;
        const x = xForTimestamp(entry.startMs);
        parts.push(`<circle class="fill-bottle" cx="${x.toFixed(1)}" cy="${rowTopPx + rowHeightPx / 2}" r="4.5"/>`);
        hitAreas.push({ fromPx: x - 5, toPx: x + 5, tip: `${formatClockTime(entry.startMs)}, בקבוק ${entry.volumeMl} מ״ל` });
        continue;
      }
      if (entry.endMs <= bucket.dayStartMs || entry.startMs >= bucket.nextDayStartMs) continue;
      for (const segment of entry.segments) {
        const clippedStartMs = Math.max(segment.startMs, bucket.dayStartMs);
        const clippedEndMs = Math.min(segment.endMs, bucket.nextDayStartMs);
        if (clippedEndMs <= clippedStartMs) continue;
        const x1 = xForTimestamp(clippedStartMs);
        const widthOfSegmentPx = Math.max(3, xForTimestamp(clippedEndMs) - x1);
        parts.push(`<rect class="${segment.side === SIDE.RIGHT ? 'fill-right' : 'fill-left'}" x="${x1.toFixed(1)}" y="${barTopPx}" width="${widthOfSegmentPx.toFixed(1)}" height="${barHeightPx}" rx="2"/>`);
      }
      const entryStartPx = xForTimestamp(Math.max(entry.startMs, bucket.dayStartMs));
      const entryEndPx = xForTimestamp(Math.min(entry.endMs, bucket.nextDayStartMs));
      hitAreas.push({
        fromPx: entryStartPx,
        toPx: Math.max(entryEndPx, entryStartPx + 3),
        tip: `${formatClockTime(entry.startMs)}, ${describeSides(entry.segments)}`,
      });
    }

    // Generous invisible tap targets on top of the small marks.
    for (const hitArea of hitAreas) {
      const centerPx = (hitArea.fromPx + hitArea.toPx) / 2;
      const hitWidthPx = Math.max(18, hitArea.toPx - hitArea.fromPx + 8);
      parts.push(`<rect class="hit-area" x="${(centerPx - hitWidthPx / 2).toFixed(1)}" y="${rowTopPx}" width="${hitWidthPx.toFixed(1)}" height="${rowHeightPx}" data-tip="${escapeHtml(hitArea.tip)}"/>`);
    }
  });

  return `<svg viewBox="0 0 ${widthPx} ${heightPx}" width="${widthPx}" height="${heightPx}" direction="ltr" role="img" aria-label="ההנקות בכל יום לפי שעה">${parts.join('')}</svg>`;
}

/** Bar with rounded top corners, anchored to the baseline. */
function roundedTopBarPath(x, yTop, width, height, radius) {
  const r = Math.min(radius, width / 2, height);
  return `M${x},${yTop + height}V${yTop + r}Q${x},${yTop} ${x + r},${yTop}H${x + width - r}Q${x + width},${yTop} ${x + width},${yTop + r}V${yTop + height}Z`;
}

/** One bar per day; values on a single axis with tick labels on the right edge. */
function buildDailyBarChartSvg({ dayBuckets, nowMs, widthPx, valueForDay, tickStep, formatTick, tooltipForDay, ariaLabel }) {
  const heightPx = 150;
  const topPx = 10;
  const bottomAxisPx = 22;
  const tickLabelColumnPx = 40;
  const plotLeftPx = 2;
  const plotRightPx = widthPx - tickLabelColumnPx;
  const plotBottomPx = heightPx - bottomAxisPx;
  const plotHeightPx = plotBottomPx - topPx;
  const plotWidthPx = plotRightPx - plotLeftPx;

  const values = dayBuckets.map(valueForDay);
  const maxValue = Math.max(tickStep, ...values);
  let step = tickStep;
  while (Math.ceil(maxValue / step) > 4) step *= 2;
  const axisMax = Math.ceil(maxValue / step) * step;
  const yForValue = value => plotBottomPx - (value / axisMax) * plotHeightPx;

  const parts = [];
  for (let tick = 0; tick <= axisMax; tick += step) {
    const y = yForValue(tick);
    parts.push(`<line class="grid-line" x1="${plotLeftPx}" x2="${plotRightPx}" y1="${y}" y2="${y}"/>`);
    parts.push(`<text x="${widthPx - 2}" y="${y + 4}" text-anchor="end">${formatTick(tick)}</text>`);
  }

  const dayCount = dayBuckets.length;
  const bandWidthPx = plotWidthPx / dayCount;
  const barWidthPx = Math.min(26, bandWidthPx * 0.64);
  // Label every day for a week; otherwise every few days, always including the newest.
  const labelEvery = dayCount <= 7 ? 1 : dayCount <= 14 ? 2 : 5;

  dayBuckets.forEach((bucket, index) => {
    const value = values[index];
    const bandLeftPx = plotLeftPx + index * bandWidthPx;
    const barLeftPx = bandLeftPx + (bandWidthPx - barWidthPx) / 2;
    if (value > 0) {
      const barTopPx = yForValue(value);
      parts.push(`<path class="fill-neutral${bucket.isToday ? ' is-partial' : ''}" d="${roundedTopBarPath(barLeftPx, barTopPx, barWidthPx, plotBottomPx - barTopPx, 4)}"/>`);
    }
    const distanceFromNewest = dayCount - 1 - index;
    if (distanceFromNewest % labelEvery === 0) {
      const label = dayCount <= 7
        ? (bucket.isToday ? 'היום' : WEEKDAY_LETTERS[new Date(bucket.dayStartMs).getDay()])
        : (bucket.isToday ? 'היום' : formatDayMonth(bucket.dayStartMs));
      parts.push(`<text x="${(bandLeftPx + bandWidthPx / 2).toFixed(1)}" y="${heightPx - 6}" text-anchor="middle">${label}</text>`);
    }
    parts.push(`<rect class="hit-area" x="${bandLeftPx.toFixed(1)}" y="${topPx}" width="${bandWidthPx.toFixed(1)}" height="${plotHeightPx}" data-tip="${escapeHtml(tooltipForDay(bucket))}"/>`);
  });

  return `<svg viewBox="0 0 ${widthPx} ${heightPx}" width="${widthPx}" height="${heightPx}" direction="ltr" role="img" aria-label="${escapeHtml(ariaLabel)}">${parts.join('')}</svg>`;
}

/* --- chart tooltip (tap to show; works with touch) --- */
function showChartTooltip(text, clientX, clientY) {
  const tooltip = elements.chartTooltip;
  tooltip.textContent = text;
  tooltip.hidden = false;
  const tooltipRect = tooltip.getBoundingClientRect();
  const left = Math.min(window.innerWidth - tooltipRect.width - 8, Math.max(8, clientX - tooltipRect.width / 2));
  const top = clientY - tooltipRect.height - 14 < 8 ? clientY + 18 : clientY - tooltipRect.height - 14;
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
}

function hideChartTooltip() {
  elements.chartTooltip.hidden = true;
}


/* =====================================================================
 * 14. SHEETS — bottle, manual add/edit, backup
 * ===================================================================== */

function openSheet(markup) {
  hideChartTooltip();
  elements.sheetBody.innerHTML = markup;
  if (!elements.sheet.open) {
    elements.sheet.showModal();
    // A history entry so the phone's Back gesture closes the sheet instead of leaving the page.
    try { history.pushState({ feedingTrackerSheet: true }, ''); } catch (error) { /* ignore */ }
  }
}

function closeSheet() {
  if (!elements.sheet.open) return;
  if (history.state && history.state.feedingTrackerSheet) {
    history.back(); // the popstate handler closes the dialog
  } else {
    elements.sheet.close();
  }
}

function buildStepperMarkup({ name, value, step, max, unit, label, swatchClass }) {
  return `
    <div class="stepper-row">
      <span class="stepper-row__label">${swatchClass ? `<span class="swatch ${swatchClass}" aria-hidden="true"></span>` : ''}${label}</span>
      <span class="stepper">
        <button type="button" data-action="step" data-target="${name}" data-delta="${step}" aria-label="להוסיף ${step}">+</button>
        <input type="number" inputmode="numeric" name="${name}" value="${value}" min="0" max="${max}" step="1" aria-label="${escapeHtml(label)}, ${unit}">
        <button type="button" data-action="step" data-target="${name}" data-delta="${-step}" aria-label="להוריד ${step}">−</button>
        <span class="stepper__unit">${unit}</span>
      </span>
    </div>`;
}

/** Add (no entry) or edit (existing entry) a breastfeed. */
function openBreastfeedSheet(existingEntry) {
  const nowMs = Date.now();
  const suggestion = computeSideSuggestion(appState.entries);
  let startMs;
  let minutesBySide;
  let firstSide;

  if (existingEntry) {
    const totalsBySide = sumDurationsBySide(existingEntry.segments);
    startMs = existingEntry.startMs;
    minutesBySide = { R: Math.round(totalsBySide.R / MS_PER_MINUTE), L: Math.round(totalsBySide.L / MS_PER_MINUTE) };
    firstSide = getSidesInOrderOfUse(existingEntry.segments)[0];
  } else {
    firstSide = suggestion ? suggestion.suggestedSide : SIDE.RIGHT;
    startMs = nowMs - 30 * MS_PER_MINUTE;
    minutesBySide = { R: 0, L: 0 };
    minutesBySide[firstSide] = 15;
  }

  openSheet(`
    <form id="breastfeed-form" data-form="breastfeed" data-entry-id="${existingEntry ? existingEntry.id : ''}" novalidate>
      <h2 id="sheet-title">${existingEntry ? 'עריכת הנקה' : 'הוספת הנקה'}</h2>
      ${existingEntry ? '' : '<p>להנקה שהתחילה בלי טיימר. אפשר לעגל, זה בסדר.</p>'}
      <div class="field">
        <label for="start-input">מתי התחילה</label>
        <input class="text-input" id="start-input" type="datetime-local" name="startLocal"
               value="${toDateTimeInputValue(startMs)}" max="${toDateTimeInputValue(nowMs)}" data-original="${toDateTimeInputValue(startMs)}">
      </div>
      <div class="field">
        ${buildStepperMarkup({ name: 'minutesR', value: minutesBySide.R, step: 1, max: 180, unit: 'דק׳', label: 'ימין', swatchClass: 'mark-right' })}
      </div>
      <div class="field">
        ${buildStepperMarkup({ name: 'minutesL', value: minutesBySide.L, step: 1, max: 180, unit: 'דק׳', label: 'שמאל', swatchClass: 'mark-left' })}
      </div>
      <fieldset class="field" data-first-side-field style="border:0;padding:0;margin-inline:0" ${minutesBySide.R > 0 && minutesBySide.L > 0 ? '' : 'hidden'}>
        <legend class="field-label" style="padding:0;margin-bottom:6px;color:var(--ink-soft)">באיזה צד התחילה</legend>
        <div class="segmented">
          ${[SIDE.RIGHT, SIDE.LEFT].map(side => `
            <label><input type="radio" name="firstSide" value="${side}" ${side === firstSide ? 'checked' : ''}><span>${SIDE_LABEL[side]}</span></label>`).join('')}
        </div>
      </fieldset>
      <p class="form-error" data-form-error></p>
      <div class="sheet-actions">
        <button class="button button--primary" type="submit">שמירה</button>
        <button class="button button--secondary" type="button" data-action="close-sheet">סגירה</button>
      </div>
      ${existingEntry ? `<button class="text-button text-button--danger" type="button" data-action="delete-entry" data-entry-id="${existingEntry.id}">מחיקת ההנקה</button>` : ''}
    </form>`);
}

function openBottleSheet(existingEntry) {
  const nowMs = Date.now();
  const volumeMl = existingEntry ? existingEntry.volumeMl : 60;
  const startMs = existingEntry ? existingEntry.startMs : nowMs;
  openSheet(`
    <form id="bottle-form" data-form="bottle" data-entry-id="${existingEntry ? existingEntry.id : ''}" novalidate>
      <h2 id="sheet-title">${existingEntry ? 'עריכת בקבוק' : 'בקבוק'}</h2>
      <div class="field">
        ${buildStepperMarkup({ name: 'volumeMl', value: volumeMl, step: 10, max: 400, unit: 'מ״ל', label: 'כמות' })}
        <div class="volume-presets">
          ${[30, 60, 90, 120, 150].map(preset => `<button type="button" data-action="set-volume" data-value="${preset}">${preset}</button>`).join('')}
        </div>
      </div>
      <div class="field">

function handleBreastfeedFormSubmit(form) {
  const originalEntry = form.dataset.entryId ? findEntryById(form.dataset.entryId) : null;
  const startMs = readStartTimeFromForm(form, originalEntry);
  const minutesBySide = {
    R: clampInteger(form.elements.minutesR.value, 0, 180),
    L: clampInteger(form.elements.minutesL.value, 0, 180),
  };
  const checkedFirstSide = form.querySelector('input[name="firstSide"]:checked');
  let firstSide = checkedFirstSide ? checkedFirstSide.value : SIDE.RIGHT;
  if (minutesBySide[firstSide] === 0) firstSide = oppositeSide(firstSide);

  if (!Number.isFinite(startMs)) return showFormError(form, 'צריך לבחור מתי ההנקה התחילה.');
  if (startMs > Date.now() + MS_PER_MINUTE) return showFormError(form, 'השעה שנבחרה עוד לא הגיעה.');
  if (minutesBySide.R + minutesBySide.L === 0) return showFormError(form, 'צריך לפחות דקה אחת באחד הצדדים.');

  const segments = buildBreastSegmentsFromForm({ startMs, minutesBySide, firstSide, originalEntry });
  upsertEntry({
    id: originalEntry ? originalEntry.id : createEntryId(),

/** Shares the file when the phone supports it (WhatsApp, Drive…); otherwise downloads it. */
async function shareOrDownloadFile(blob, fileName, shareTitle) {
  const file = new File([blob], fileName, { type: blob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: shareTitle });
      return true;
    }
  } catch (error) {
    if (error && error.name === 'AbortError') return false; // user closed the share sheet
    // Any other share failure: fall back to a download below.
  }
  const objectUrl = URL.createObjectURL(blob);
  const downloadLink = document.createElement('a');
  downloadLink.href = objectUrl;
  downloadLink.download = fileName;
  document.body.appendChild(downloadLink);
  downloadLink.click();
  downloadLink.remove();
  window.setTimeout(() => URL.revokeObjectURL(objectUrl), 5000);
  return true;
}

async function exportBackupJson() {
  const payload = {
    app: 'feeding-tracker',
    formatVersion: 1,
    exportedAt: new Date().toISOString(),
    entries: appState.entries,
    meals: appState.meals,
    settings: { babyName: appState.babyName },
  };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const delivered = await shareOrDownloadFile(blob, `feeding-backup-${formatDateStamp(Date.now())}.json`, 'גיבוי הנקות');
  if (!delivered) return;
  storage.writeJson(STORAGE_KEYS.lastBackupMs, Date.now());

function toCsvField(value) {
  const text = String(value);
  return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

async function exportCsv() {
  const headerRow = ['תאריך', 'שעת התחלה', 'שעת סיום', 'סוג', 'צד ראשון', 'דקות ימין', 'דקות שמאל', 'סך הכול דקות', 'מ״ל',
    'מאכלים', 'כמות', 'אהבה?', 'תגובה'];
  const allRecords = [...appState.entries, ...appState.meals.map(meal => ({ ...meal, type: 'meal' }))]
    .sort((first, second) => first.startMs - second.startMs);
  const dataRows = allRecords.map(entry => {
    const date = new Date(entry.startMs);
    const dateText = `${padTwoDigits(date.getDate())}/${padTwoDigits(date.getMonth() + 1)}/${date.getFullYear()}`;
    if (entry.type === 'meal') {
      return [dateText, formatClockTime(entry.startMs), '', 'אוכל', '', '', '', '', '',
        entry.foods.join(' / '), entry.amount ? MEAL_AMOUNTS[entry.amount] : '',
        entry.liking ? MEAL_LIKINGS[entry.liking].label : '', entry.reaction || ''];
    }
    if (entry.type === 'bottle') {
      return [dateText, formatClockTime(entry.startMs), '', 'בקבוק', '', '', '', '', entry.volumeMl, '', '', '', ''];
    }
    const totalsBySide = sumDurationsBySide(entry.segments);
    const toMinutes = durationMs => (durationMs / MS_PER_MINUTE).toFixed(1);
    return [
      dateText, formatClockTime(entry.startMs), formatClockTime(entry.endMs), 'הנקה',
      SIDE_LABEL[getSidesInOrderOfUse(entry.segments)[0]],
      toMinutes(totalsBySide.R), toMinutes(totalsBySide.L), toMinutes(totalsBySide.R + totalsBySide.L), '', '', '', '', '',
    ];
  });
  // The BOM makes Excel open Hebrew UTF-8 correctly.
  const csvText = '﻿' + [headerRow, ...dataRows].map(row => row.map(toCsvField).join(',')).join('\r\n');
  const blob = new Blob([csvText], { type: 'text/csv' });
  const delivered = await shareOrDownloadFile(blob, `feeding-log-${formatDateStamp(Date.now())}.csv`, 'יומן הנקות');
  if (delivered) showToast('הקובץ מוכן');
}

async function importBackupFile(file) {
  let parsedBackup;
  try {
    parsedBackup = JSON.parse(await file.text());
  } catch (error) {
    showToast('הקובץ הזה הוא לא קובץ גיבוי של האפליקציה');
    return;
  }
  const candidateEntries = Array.isArray(parsedBackup) ? parsedBackup : (parsedBackup && parsedBackup.entries);
  const validEntries = Array.isArray(candidateEntries) ? candidateEntries.filter(isValidEntry) : [];
  const candidateMeals = parsedBackup && !Array.isArray(parsedBackup) ? parsedBackup.meals : null;
  const validMeals = Array.isArray(candidateMeals) ? candidateMeals.filter(isValidMeal) : [];
  const validCount = validEntries.length + validMeals.length;
  if (validCount === 0) {
    showToast('לא נמצאו רישומים בקובץ הזה');
    return;
  }
  const existingEntryIds = new Set(appState.entries.map(entry => entry.id));
  const existingMealIds = new Set(appState.meals.map(meal => meal.id));
  const newEntries = validEntries.filter(entry => !existingEntryIds.has(entry.id));
  const newMeals = validMeals.filter(meal => !existingMealIds.has(meal.id));
  const newCount = newEntries.length + newMeals.length;
  if (newCount === 0) {
    showToast('כל הרישומים שבקובץ כבר נמצאים כאן');
    return;
  }
  const confirmed = window.confirm(`בקובץ יש ${validCount} רישומים, ${newCount} מהם חדשים. להוסיף אותם?`);
  if (!confirmed) return;
  appState.entries.push(...newEntries);
  appState.meals.push(...newMeals);
  const backupName = parsedBackup && parsedBackup.settings && parsedBackup.settings.babyName;
  if (!appState.babyName && typeof backupName === 'string' && backupName.trim()) {
    appState.babyName = backupName.trim().slice(0, MAX_BABY_NAME_LENGTH);
    storage.writeJson(STORAGE_KEYS.babyName, appState.babyName);
  }
  saveEntries();
  saveMeals();
  closeSheet();
  renderAll();
  showToast(`נוספו ${newCount} רישומים`);
}

function clearAllData() {
  if (!window.confirm('למחוק את כל הרישומים מהטלפון הזה? אי אפשר לבטל את זה.')) return;

 * 16a. SOLID FOOD — statistics
 * ===================================================================== */

/**
 * Per-food and per-allergen statistics over all meals.
 * statsByFood: name → { tries, firstMs, firstMealId, lastLiking, hadReaction }
 * statsByAllergen: key → { tries, firstMs, hadReaction }
 */
function computeFoodStats(meals, { excludeMealId = null } = {}) {
  const statsByFood = new Map();
  const statsByAllergen = new Map();
  for (const meal of meals) {
    if (meal.id === excludeMealId) continue;
    for (const foodName of meal.foods) {
      if (!statsByFood.has(foodName)) {
        statsByFood.set(foodName, { tries: 0, firstMs: meal.startMs, firstMealId: meal.id, lastLiking: null, hadReaction: false });
      }
      const foodStats = statsByFood.get(foodName);
      foodStats.tries += 1;
      if (meal.liking) foodStats.lastLiking = meal.liking;
      if (meal.reaction) foodStats.hadReaction = true;

      const allergenKey = FOOD_TO_ALLERGEN[foodName];
      if (allergenKey) {
        if (!statsByAllergen.has(allergenKey)) statsByAllergen.set(allergenKey, { tries: 0, firstMs: meal.startMs, hadReaction: false });
        const allergenStats = statsByAllergen.get(allergenKey);
        allergenStats.tries += 1;
        if (meal.reaction) allergenStats.hadReaction = true;
      }
    }
  }
  return { statsByFood, statsByAllergen };
}

/** Foods tried that are not in the built-in catalog (typed by hand). */
function getCustomFoodNames(statsByFood) {
  return [...statsByFood.keys()].filter(foodName => !CATALOG_FOOD_NAMES.has(foodName));
}

function formatMealCount(count) {
  return count === 1 ? 'ארוחה אחת' : `${count} ארוחות`;
}

function formatFoodCount(count) {
  return count === 1 ? 'מאכל אחד' : `${count} מאכלים`;
}

function renderFoodScreen() {

function buildMealDaysMarkup(statsByFood, nowMs) {
  const mealsByDay = new Map();
  for (let index = appState.meals.length - 1; index >= 0; index -= 1) {
    const meal = appState.meals[index];
    const dayStartMs = startOfLocalDay(meal.startMs);
    if (!mealsByDay.has(dayStartMs)) mealsByDay.set(dayStartMs, []);
    mealsByDay.get(dayStartMs).push(meal);
  }
  const allDays = [...mealsByDay.keys()];
  const shownDays = allDays.slice(0, appState.mealDaysShown);

  const daysMarkup = shownDays.map(dayStartMs => {
    const dayMeals = mealsByDay.get(dayStartMs);
    return `
      <section class="history-day">
        <div class="history-day__head">
          <h3 class="history-day__title">${formatDayHeading(dayStartMs, nowMs)}</h3>
          <p class="history-day__summary">${formatMealCount(dayMeals.length)}</p>
        </div>
        ${dayMeals.map(meal => buildMealEntryMarkup(meal, statsByFood)).join('')}
      </section>`;
  }).join('');

  const moreButton = allDays.length > shownDays.length
    ? `<button class="button button--secondary button--block more-history" type="button" data-action="meals-more">להציג ימים קודמים</button>`
    : '';
  return daysMarkup + moreButton;
}

function buildMealEntryMarkup(meal, statsByFood) {
  const foodsMarkup = meal.foods.map(foodName => {
    const isFirstTime = statsByFood.get(foodName) && statsByFood.get(foodName).firstMealId === meal.id;
    return `${escapeHtml(foodName)}${isFirstTime ? '<span class="new-badge">חדש</span>' : ''}`;
  }).join(', ');
  const metaParts = [];
  if (meal.amount) metaParts.push(MEAL_AMOUNTS[meal.amount]);
  if (meal.liking) metaParts.push(MEAL_LIKINGS[meal.liking].label);
  const liking = meal.liking ? MEAL_LIKINGS[meal.liking] : null;

  return `
    <button class="history-entry" type="button" data-action="edit-meal" data-meal-id="${meal.id}">
      <span class="history-entry__time">${formatClockTime(meal.startMs)}</span>
      <span>
        <span class="meal-foods">${foodsMarkup}</span>
        ${metaParts.length ? `<span class="meal-meta">${metaParts.join(', ')}</span>` : ''}
        ${meal.reaction ? `<span class="reaction-text">תגובה: ${escapeHtml(meal.reaction)}</span>` : ''}
      </span>
      <span class="liking-emoji" ${liking ? `aria-label="${liking.label}"` : 'aria-hidden="true"'}>${liking ? liking.emoji : ''}</span>
    </button>`;
}

function buildFoodChipMarkup({ label, foodToLog, tries, hadReaction }) {
  const triedClass = tries > 0 ? ' is-tried' : '';
  const countMarkup = tries > 0 ? `<span class="food-chip__count" dir="ltr">✓${tries}</span>` : '';
  const reactionMarkup = hadReaction ? '<span class="reaction-dot" aria-label="נרשמה תגובה"></span>' : '';
  return `<button class="food-chip${triedClass}" type="button" data-action="open-meal" data-food="${escapeHtml(foodToLog)}">${escapeHtml(label)}${countMarkup}${reactionMarkup}</button>`;
}

function buildFoodCollectionMarkup(statsByFood, statsByAllergen) {
  const groupMarkups = [];

  // Allergens: one chip per allergen, tried if any food containing it was eaten.
  const allergenChips = ALLERGENS.map(allergen => {
    const allergenStats = statsByAllergen.get(allergen.key);
    return buildFoodChipMarkup({
      label: allergen.label,
      foodToLog: allergen.food,
      tries: allergenStats ? allergenStats.tries : 0,
      hadReaction: Boolean(allergenStats && allergenStats.hadReaction),
    });
  }).join('');
  groupMarkups.push(buildFoodGroupMarkup('אלרגנים נפוצים', statsByAllergen.size, ALLERGENS.length, allergenChips));

  for (const group of FOOD_GROUPS) {
    if (group.id === 'allergens') continue;
    let triedInGroup = 0;
    const chips = group.foods.map(foodName => {
      const foodStats = statsByFood.get(foodName);
      if (foodStats) triedInGroup += 1;
      return buildFoodChipMarkup({
        label: foodName,
        foodToLog: foodName,
        tries: foodStats ? foodStats.tries : 0,
        hadReaction: Boolean(foodStats && foodStats.hadReaction),
      });
    }).join('');
    groupMarkups.push(buildFoodGroupMarkup(group.title, triedInGroup, group.foods.length, chips));
  }

  const customFoodNames = getCustomFoodNames(statsByFood);
  if (customFoodNames.length) {
    const chips = customFoodNames.map(foodName => {
      const foodStats = statsByFood.get(foodName);
      return buildFoodChipMarkup({ label: foodName, foodToLog: foodName, tries: foodStats.tries, hadReaction: foodStats.hadReaction });
    }).join('');
    groupMarkups.push(buildFoodGroupMarkup('עוד מאכלים', null, null, chips));
  }
  return groupMarkups.join('');
}

function buildFoodGroupMarkup(title, triedCount, totalCount, chipsMarkup) {
  const countMarkup = totalCount ? `<span class="food-group__count">${triedCount} מתוך ${totalCount}</span>` : '';
  return `
    <div class="food-group">
      <div class="food-group__head"><h3 class="food-group__title">${title}</h3>${countMarkup}</div>
      <div class="chip-row">${chipsMarkup}</div>
    </div>`;
}

 * ===================================================================== */

function findMealById(mealId) {
  return appState.meals.find(meal => meal.id === mealId) || null;
}

function buildSelectableChipMarkup(foodName, isSelected) {
  return `<button class="food-chip" type="button" data-action="toggle-food" data-food="${escapeHtml(foodName)}" aria-pressed="${isSelected}">${escapeHtml(foodName)}</button>`;
}

function buildRadioGroupMarkup(name, optionsByValue, checkedValue, labelForOption) {
  return Object.keys(optionsByValue).map(value => `
    <label><input type="radio" name="${name}" value="${value}" ${value === checkedValue ? 'checked' : ''}><span>${labelForOption(optionsByValue[value])}</span></label>`).join('');
}

function openMealSheet(existingMeal, preselectedFoodName = null) {
  const nowMs = Date.now();
  const selectedFoods = new Set(existingMeal ? existingMeal.foods : (preselectedFoodName ? [preselectedFoodName] : []));
  const { statsByFood } = computeFoodStats(appState.meals);
  const customFoodNames = [...new Set([...getCustomFoodNames(statsByFood), ...[...selectedFoods].filter(food => !CATALOG_FOOD_NAMES.has(food))])];
  const startMs = existingMeal ? existingMeal.startMs : nowMs;

  const groupsMarkup = FOOD_GROUPS.map(group => `
    <div class="food-group">
      <div class="food-group__head"><h3 class="food-group__title">${group.title}</h3></div>
      <div class="chip-row">${group.foods.map(food => buildSelectableChipMarkup(food, selectedFoods.has(food))).join('')}</div>
    </div>`).join('');

  openSheet(`
    <form id="meal-form" data-form="meal" data-meal-id="${existingMeal ? existingMeal.id : ''}" novalidate>
      <h2 id="sheet-title">${existingMeal ? 'עריכת ארוחה' : 'ארוחה'}</h2>
      <p>מה ${babyLabel()} אכלה? אפשר לבחור כמה מאכלים.</p>
      ${groupsMarkup}
      <div class="food-group" data-custom-group ${customFoodNames.length ? '' : 'hidden'}>
        <div class="food-group__head"><h3 class="food-group__title">עוד מאכלים</h3></div>
        <div class="chip-row" data-custom-chips>${customFoodNames.map(food => buildSelectableChipMarkup(food, selectedFoods.has(food))).join('')}</div>
      </div>
      <div class="custom-food-row">
        <input class="text-input" type="text" name="customFood" maxlength="${MAX_FOOD_NAME_LENGTH}" placeholder="מאכל אחר" aria-label="שם של מאכל אחר" enterkeyhint="done">
        <button class="button button--secondary" type="button" data-action="add-custom-food">הוספה</button>
      </div>
      <p class="allergen-note" data-allergen-note hidden></p>

      <div class="field">
        <span class="field-label">כמה אכלה</span>
        <div class="segmented segmented--wrap">${buildRadioGroupMarkup('amount', MEAL_AMOUNTS, existingMeal ? existingMeal.amount : null, label => label)}</div>
      </div>
      <div class="field">
        <span class="field-label">איך היה</span>
        <div class="segmented">${buildRadioGroupMarkup('liking', MEAL_LIKINGS, existingMeal ? existingMeal.liking : null, liking => `${liking.emoji} ${liking.label}`)}</div>
      </div>
      <div class="field">
        <label for="reaction-input">תגובה שראיתם (לא חובה)</label>
        <input class="text-input text-input--reaction" id="reaction-input" type="text" name="reaction" maxlength="${MAX_REACTION_NOTE_LENGTH}"
               placeholder="למשל: פריחה סביב הפה" value="${existingMeal && existingMeal.reaction ? escapeHtml(existingMeal.reaction) : ''}">
      </div>
      <div class="field">
        <label for="meal-time-input">מתי</label>
        <input class="text-input" id="meal-time-input" type="datetime-local" name="startLocal"
               value="${toDateTimeInputValue(startMs)}" max="${toDateTimeInputValue(nowMs + MS_PER_MINUTE)}" data-original="${toDateTimeInputValue(startMs)}">
      </div>
      <p class="form-error" data-form-error></p>
      <div class="sheet-actions">
        <button class="button button--primary" type="submit">שמירה</button>
        <button class="button button--secondary" type="button" data-action="close-sheet">סגירה</button>
      </div>
      ${existingMeal ? `<button class="text-button text-button--danger" type="button" data-action="delete-meal" data-meal-id="${existingMeal.id}">מחיקת הארוחה</button>` : ''}
    </form>`);
  updateAllergenNote(document.getElementById('meal-form'));
}

function getSelectedFoodsFromForm(form) {
  return [...form.querySelectorAll('[data-action="toggle-food"][aria-pressed="true"]')].map(chip => chip.dataset.food);
}

function addCustomFoodToForm(form) {
  const input = form.elements.customFood;
  const foodName = input.value.trim().replace(/\s+/g, ' ').slice(0, MAX_FOOD_NAME_LENGTH);
  if (!foodName) { input.focus(); return; }
  const existingChip = [...form.querySelectorAll('[data-action="toggle-food"]')].find(chip => chip.dataset.food === foodName);
  if (existingChip) {
    existingChip.setAttribute('aria-pressed', 'true');
  } else {
    form.querySelector('[data-custom-chips]').insertAdjacentHTML('beforeend', buildSelectableChipMarkup(foodName, true));
    form.querySelector('[data-custom-group]').hidden = false;
  }
  input.value = '';
  showFormError(form, '');
  updateAllergenNote(form);
}

/** "היום" / "אתמול" / "לפני 2 ימים" between two timestamps, by calendar day. */
function formatDaysBefore(earlierMs, laterMs) {
  const days = Math.round((startOfLocalDay(laterMs) - startOfLocalDay(earlierMs)) / MS_PER_DAY);
  if (days <= 0) return 'היום';
  if (days === 1) return 'אתמול';
  return `לפני ${days} ימים`;
}

/**
 * Gentle note when this meal introduces a new allergen shortly after another one,
 * or more than one new allergen at once (it makes a reaction harder to trace).
 */
function updateAllergenNote(form) {
  const noteElement = form.querySelector('[data-allergen-note]');
  const mealId = form.dataset.mealId || null;
  const mealTimeMs = fromDateTimeInputValue(form.elements.startLocal.value) || Date.now();
  const { statsByAllergen } = computeFoodStats(appState.meals, { excludeMealId: mealId });

  const newAllergenKeys = [...new Set(getSelectedFoodsFromForm(form)
    .map(food => FOOD_TO_ALLERGEN[food])
    .filter(allergenKey => allergenKey && !statsByAllergen.has(allergenKey)))];
  const labelFor = allergenKey => ALLERGENS.find(allergen => allergen.key === allergenKey).label;

  let noteText = '';
  if (newAllergenKeys.length > 1) {
    noteText = `בארוחה הזו יש ${newAllergenKeys.length} אלרגנים חדשים (${newAllergenKeys.map(labelFor).join(', ')}). אם תהיה תגובה, יהיה קשה לדעת מה גרם לה.`;
  } else if (newAllergenKeys.length === 1) {
    let latestIntroduction = null;
    for (const [allergenKey, allergenStats] of statsByAllergen) {
      const isRecent = allergenStats.firstMs <= mealTimeMs && mealTimeMs - allergenStats.firstMs < NEW_ALLERGEN_SPACING_MS;
      if (isRecent && (!latestIntroduction || allergenStats.firstMs > latestIntroduction.firstMs)) {
        latestIntroduction = { allergenKey, firstMs: allergenStats.firstMs };
      }
    }
    if (latestIntroduction) {
      noteText = `${labelFor(newAllergenKeys[0])} חדש, ו${labelFor(latestIntroduction.allergenKey)} נוסף לראשונה ${formatDaysBefore(latestIntroduction.firstMs, mealTimeMs)}. נוח לחכות כמה ימים בין אלרגנים חדשים, כדי לדעת מה גרם לתגובה אם תהיה.`;
    }
  }
  noteElement.textContent = noteText;
  noteElement.hidden = !noteText;
}

function handleMealFormSubmit(form) {
  const originalMeal = form.dataset.mealId ? findMealById(form.dataset.mealId) : null;
  // A typed food that was not yet added with the button still counts.
  if (form.elements.customFood.value.trim()) addCustomFoodToForm(form);

  const foods = getSelectedFoodsFromForm(form);
  const startMs = readStartTimeFromForm(form, originalMeal);
  const checkedAmount = form.querySelector('input[name="amount"]:checked');
  const checkedLiking = form.querySelector('input[name="liking"]:checked');
  const reaction = form.elements.reaction.value.trim().slice(0, MAX_REACTION_NOTE_LENGTH);

  if (foods.length === 0) return showFormError(form, 'צריך לבחור לפחות מאכל אחד.');
  if (!Number.isFinite(startMs)) return showFormError(form, 'צריך לבחור מתי.');
  if (startMs > Date.now() + 2 * MS_PER_MINUTE) return showFormError(form, 'השעה שנבחרה עוד לא הגיעה.');

  const meal = {
    id: originalMeal ? originalMeal.id : createEntryId(),
    startMs,
    foods,
    amount: checkedAmount ? checkedAmount.value : null,
    liking: checkedLiking ? checkedLiking.value : null,
    reaction: reaction || null,
  };
  const existingIndex = appState.meals.findIndex(existing => existing.id === meal.id);
  if (existingIndex >= 0) appState.meals[existingIndex] = meal;
  else appState.meals.push(meal);
  saveMeals();
  requestPersistentStorageOnce();
  closeSheet();
  renderAll();
  showToast(originalMeal ? 'השינויים נשמרו' : 'הארוחה נשמרה');
  // Wait for the sheet to finish closing before a surprise appears.
  window.setTimeout(maybeShowFoodMoment, 350);
}


/* =====================================================================
 * 16d. MOMENTS — small surprises
 *  - Morning after a night with feeds: "כל הכבוד, צלחת עוד לילה" (once per morning).
 *  - Tap the title 5 times: hearts and "אנחנו אוהבים אותך".
 *  - Feeding between 01:00 and 05:00: a warm line under the timer.
 *  - Sometimes the "saved" message ends with something sweet.
 *  - Breastfeed milestones (50, 100, 200 …), first solid food, foods-tried milestones, all allergens.
 * ===================================================================== */

function pickRandom(items) {
  return items[Math.floor(Math.random() * items.length)];
}

/** Same pick for the whole day, so the line does not change on every redraw. */
function pickForToday(items) {
  const dayNumber = Math.floor(startOfLocalDay(Date.now()) / MS_PER_DAY);
  return items[dayNumber % items.length];
}

function hasSeenMoment(momentKey) {
  return Boolean(storage.readJson(STORAGE_KEYS.momentsSeen, {})[momentKey]);
}

function markMomentSeen(momentKey) {
  const momentsSeen = storage.readJson(STORAGE_KEYS.momentsSeen, {});
  momentsSeen[momentKey] = Date.now();
  storage.writeJson(STORAGE_KEYS.momentsSeen, momentsSeen);
}

/** Shows the moment card; returns false if another one is already open. */
function showMoment({ art, title, text, withHearts = false, buttonLabel = 'תודה 💛' }) {
  if (!elements.moment.hidden) return false;
  hideChartTooltip();
  elements.momentArt.textContent = art;
  elements.momentTitle.textContent = title;
  elements.momentText.textContent = text;
  elements.momentButton.textContent = buttonLabel;
  elements.moment.hidden = false;
  elements.momentButton.focus({ preventScroll: true });
  if (withHearts) releaseHearts();
  return true;
}

function closeMoment() {
  elements.moment.hidden = true;
}

function releaseHearts(heartCount = 18) {
  try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (error) { /* ignore */ }
  for (let index = 0; index < heartCount; index += 1) {
    const heart = document.createElement('span');
    heart.textContent = '♥';
    heart.style.left = `${4 + Math.random() * 88}%`;
    heart.style.fontSize = `${18 + Math.random() * 20}px`;
    heart.style.animationDelay = `${Math.random() * 1.1}s`;
    heart.style.setProperty('--drift', `${Math.round(-50 + Math.random() * 100)}px`);
    elements.hearts.appendChild(heart);
    window.setTimeout(() => heart.remove(), 5000);
  }
}

/** Five quick taps on the title. */
let recentTitleTapTimes = [];
function handleTitleTap() {
  const nowMs = Date.now();
  recentTitleTapTimes = recentTitleTapTimes.filter(tapMs => nowMs - tapMs < TITLE_TAP_WINDOW_MS);
  recentTitleTapTimes.push(nowMs);
  if (recentTitleTapTimes.length < TITLE_TAPS_FOR_LOVE) return;
  recentTitleTapTimes = [];
  haptic();
  showMoment({ art: '💛', title: 'אנחנו אוהבים אותך', text: `${babyLabel()} ואבא`, withHearts: true, buttonLabel: 'גם אני אתכם' });
}

/** Line under the timer for feeds in the small hours. */
function buildNightNoteMarkup() {
  const hour = new Date().getHours();
  return hour >= 1 && hour < 5 ? `<p class="night-note">${escapeHtml(pickForToday(NIGHT_NOTES()))}</p>` : '';
}

/** Morning (05:00–11:00) after a night with at least one feed: once per morning. */
function maybeShowMorningMoment() {
  const nowMs = Date.now();
  const hour = new Date(nowMs).getHours();
  if (hour < 5 || hour >= 11 || appState.activeSession) return false;
  const momentKey = `morning-${formatDateStamp(nowMs)}`;
  if (hasSeenMoment(momentKey)) return false;

  const todayStartMs = startOfLocalDay(nowMs);
  const yesterdayStartMs = addLocalDays(todayStartMs, -1);
  const nightStartMs = new Date(yesterdayStartMs).setHours(NIGHT_START_HOUR, 0, 0, 0);
  const nightEndMs = new Date(todayStartMs).setHours(NIGHT_END_HOUR, 0, 0, 0);
  const nightFeedCount = appState.entries.filter(entry => entry.startMs >= nightStartMs && entry.startMs < nightEndMs).length;
  if (nightFeedCount === 0) return false;

  const countSentence = nightFeedCount === 1 ? 'הייתה האכלה אחת בלילה.' : `היו ${nightFeedCount} האכלות בלילה.`;
  const shown = showMoment({
    art: '☀️',
    title: 'כל הכבוד, צלחת עוד לילה',
    text: `${countSentence} ${pickRandom(MORNING_ENDINGS())}`,
    buttonLabel: 'בוקר טוב',
  });
  if (shown) markMomentSeen(momentKey);
  return shown;
}

function maybeShowBreastfeedMilestone() {
  const breastfeedCount = appState.entries.filter(entry => entry.type === 'breast').length;
  if (!BREASTFEED_MILESTONES.includes(breastfeedCount)) return false;
  const momentKey = `breastfeeds-${breastfeedCount}`;
  if (hasSeenMoment(momentKey)) return false;
  const text = breastfeedCount === 100
    ? `מאה פעמים ש${babyLabel()} קיבלה ממך את הכי טוב שיש. אנחנו אוהבים אותך.`
    : `${breastfeedCount} הנקות, וכל אחת מהן בשביל ${babyLabel()}. אנחנו אוהבים אותך.`;
  const shown = showMoment({ art: '🏅', title: `הנקה מספר ${breastfeedCount}`, text, withHearts: true });
  if (shown) markMomentSeen(momentKey);
  return shown;
}

/** First solid food ever, foods-tried milestones, and all allergens introduced. */
function maybeShowFoodMoment() {
  const { statsByFood, statsByAllergen } = computeFoodStats(appState.meals);
  const candidates = [];
  if (appState.meals.length > 0) {
    candidates.push({ key: 'food-first', art: '🥄', title: 'הביס הראשון!', text: `${babyLabel()} התחילה לאכול. איזה רגע.`, withHearts: true });
  }
  for (const milestone of FOODS_TRIED_MILESTONES) {
    if (statsByFood.size >= milestone) {
      candidates.push({ key: `foods-${milestone}`, art: '🥕', title: `${milestone} מאכלים!`, text: `${babyLabel()} כבר טעמה ${milestone} מאכלים שונים. כל הכבוד לכן.` });
    }
  }
  if (statsByAllergen.size === ALLERGENS.length) {
    candidates.push({ key: 'allergens-all', art: '🌟', title: 'כל האלרגנים הנפוצים', text: `${babyLabel()} טעמה את כל ${ALLERGENS.length} האלרגנים הנפוצים. עבודה יסודית!` });
  }
  // Only the newest unseen one; older milestones reached at the same time are marked as seen quietly.
  const unseen = candidates.filter(candidate => !hasSeenMoment(candidate.key));
  if (unseen.length === 0) return false;
  const newest = unseen[unseen.length - 1];
  const shown = showMoment(newest);
  if (shown) unseen.forEach(candidate => markMomentSeen(candidate.key));
  return shown;
}

/* =====================================================================
 * 16. TOAST
 * ===================================================================== */

let toastTimeoutId = null;
let toastActionHandler = null;

function showToast(message, { actionLabel = null, onAction = null, durationMs = 3200 } = {}) {
  elements.toastMessage.textContent = message;
  elements.toastAction.hidden = !actionLabel;
  elements.toastAction.textContent = actionLabel || '';
  toastActionHandler = onAction;
  elements.toast.hidden = false;
  window.clearTimeout(toastTimeoutId);
  toastTimeoutId = window.setTimeout(hideToast, durationMs);
}

function hideToast() {
  elements.toast.hidden = true;
  toastActionHandler = null;
}


/* =====================================================================
 * 17. EVENT WIRING
 * ===================================================================== */

document.addEventListener('click', event => {
  const actionElement = event.target.closest('[data-action]');
  if (!actionElement) return;
  const action = actionElement.dataset.action;

  switch (action) {
    case 'dial': {
      const side = actionElement.dataset.side;
      if (appState.activeSession) switchOrResumeOnSide(side);
      else startFeeding(side);
      break;
    }
    case 'pause': pauseFeeding(); break;
    case 'resume': resumeFeeding(); break;
    case 'finish': finishFeeding(); break;
    case 'discard': discardActiveFeeding(); break;

    case 'go-tab':
      appState.currentTab = actionElement.dataset.tab;
      hideChartTooltip();
      renderAll();
      window.scrollTo(0, 0);
      break;

    case 'history-more':
      appState.historyDaysShown += HISTORY_DAYS_PAGE_SIZE;
      renderHistoryScreen();
      break;

    case 'set-range':
      appState.insightsRangeDays = Number(actionElement.dataset.days);
      storage.writeJson(STORAGE_KEYS.insightsRangeDays, appState.insightsRangeDays);
      renderInsightsScreen();
      break;

    case 'open-bottle': openBottleSheet(null); break;
    case 'open-manual-add': openBreastfeedSheet(null); break;
    case 'open-backup': openBackupSheet(); break;
    case 'close-sheet': closeSheet(); break;

    case 'edit-entry': {
      const entry = findEntryById(actionElement.dataset.entryId);
      if (!entry) break;
      if (entry.type === 'bottle') openBottleSheet(entry);
      else openBreastfeedSheet(entry);
      break;
    }

    case 'delete-entry': {
      const entry = findEntryById(actionElement.dataset.entryId);
      if (!entry) break;
      const question = entry.type === 'bottle' ? 'למחוק את הבקבוק הזה?' : 'למחוק את ההנקה הזו?';
      if (!window.confirm(question)) break;
      deleteEntry(entry.id);
      closeSheet();
      renderAll();
      showToast('הרישום נמחק');
      break;
    }

    case 'step': {
      const input = actionElement.closest('form').elements[actionElement.dataset.target];
      const maximum = Number(input.max) || 999;
      input.value = clampInteger(Number(input.value || 0) + Number(actionElement.dataset.delta), 0, maximum);
      input.dispatchEvent(new Event('input', { bubbles: true }));
      break;
    }

    case 'set-volume': {
      const input = actionElement.closest('form').elements.volumeMl;
      input.value = actionElement.dataset.value;
      break;
    }

    case 'title-tap': handleTitleTap(); break;
    case 'close-moment': closeMoment(); break;

    case 'open-meal': openMealSheet(null, actionElement.dataset.food || null); break;
    case 'meals-more':
      appState.mealDaysShown += MEAL_DAYS_PAGE_SIZE;
      renderFoodScreen();
      break;
    case 'toggle-food': {
      const isPressed = actionElement.getAttribute('aria-pressed') === 'true';
      actionElement.setAttribute('aria-pressed', String(!isPressed));
      const form = actionElement.closest('form');
      showFormError(form, '');
      updateAllergenNote(form);
      break;
    }
    case 'add-custom-food': addCustomFoodToForm(actionElement.closest('form')); break;
    case 'edit-meal': {
      const meal = findMealById(actionElement.dataset.mealId);
      if (meal) openMealSheet(meal);
      break;
    }
    case 'delete-meal': {
      if (!window.confirm('למחוק את הארוחה הזו?')) break;
      appState.meals = appState.meals.filter(meal => meal.id !== actionElement.dataset.mealId);
      saveMeals();
      closeSheet();
      renderAll();
      showToast('הארוחה נמחקה');
      break;
    }

    case 'export-json': exportBackupJson(); break;
    case 'export-csv': exportCsv(); break;
    case 'import-backup': elements.importFileInput.click(); break;
    case 'clear-all': clearAllData(); break;
    default: break;
  }
});

// Forms inside the sheet.
document.addEventListener('submit', event => {
  const form = event.target;
  event.preventDefault();
  if (form.dataset.form === 'breastfeed') handleBreastfeedFormSubmit(form);
  if (form.dataset.form === 'bottle') handleBottleFormSubmit(form);
  if (form.dataset.form === 'meal') handleMealFormSubmit(form);
  if (form.dataset.form === 'name') handleNameFormSubmit(form);
});

// Show "which side did it start on" only when both sides have minutes.
document.addEventListener('input', event => {
  const mealForm = event.target.closest && event.target.closest('form[data-form="meal"]');
  if (mealForm && event.target.name === 'startLocal') updateAllergenNote(mealForm);
  const form = event.target.closest && event.target.closest('form[data-form="breastfeed"]');
  if (!form) return;
  const bothSidesUsed = Number(form.elements.minutesR.value) > 0 && Number(form.elements.minutesL.value) > 0;
  form.querySelector('[data-first-side-field]').hidden = !bothSidesUsed;
  showFormError(form, '');
});

document.addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.name === 'customFood') {
    event.preventDefault();
    addCustomFoodToForm(event.target.closest('form'));
  }
  if (event.key === 'Escape' && !elements.moment.hidden) closeMoment();
});
elements.moment.addEventListener('click', event => {
  if (event.target === elements.moment) closeMoment();
});

// Tapping the dim area around a sheet closes it.
elements.sheet.addEventListener('click', event => {
  if (event.target === elements.sheet) closeSheet();
});
elements.sheet.addEventListener('cancel', event => {
  event.preventDefault();
  closeSheet();
});
window.addEventListener('popstate', () => {
  if (elements.sheet.open) elements.sheet.close();
});

elements.importFileInput.addEventListener('change', () => {
  const chosenFile = elements.importFileInput.files && elements.importFileInput.files[0];
  elements.importFileInput.value = '';
  if (chosenFile) importBackupFile(chosenFile);
});

elements.toastAction.addEventListener('click', () => {
  const handler = toastActionHandler;
  hideToast();
  if (handler) handler();
});

// Chart tooltips: tap a mark to see its details; tap anywhere else to hide.
document.addEventListener('pointerdown', event => {
  const tipTarget = event.target.closest && event.target.closest('.chart [data-tip]');
  if (tipTarget) showChartTooltip(tipTarget.getAttribute('data-tip'), event.clientX, event.clientY);
  else hideChartTooltip();
});
window.addEventListener('scroll', hideChartTooltip, { passive: true });

// Redraw charts when the screen width changes (rotation).
let resizeTimeoutId = null;
window.addEventListener('resize', () => {
  window.clearTimeout(resizeTimeoutId);
  resizeTimeoutId = window.setTimeout(() => {
    if (appState.currentTab === 'insights') renderInsightsScreen();
  }, 200);
});

// Coming back to the page (phone unlocked, app switched): re-read storage and redraw.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  loadStateFromStorage();
  renderAll();
  maybeShowMorningMoment();
});

// Another tab of the same page changed the data.
window.addEventListener('storage', event => {
  if (event.key && !event.key.startsWith('feedingTracker.')) return;
  loadStateFromStorage();
  renderAll();
});

// Clock: timers every second; full redraw when the calendar day changes.
let renderedDayStartMs = startOfLocalDay(Date.now());
window.setInterval(() => {
  const todayStartMs = startOfLocalDay(Date.now());
  if (todayStartMs !== renderedDayStartMs) {
    renderedDayStartMs = todayStartMs;
    renderAll();
    return;
  }
  updateLiveValues();
}, 1000);


/* =====================================================================
 * 18. START
 * ===================================================================== */

/** Offline support when installed from a web address (does nothing for a file opened from the phone). */
function registerOfflineSupport() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(window.location.protocol)) return;
  navigator.serviceWorker.register('sw.js').catch(() => { /* the app still works online */ });
}

loadStateFromStorage();
renderAll();
if (!appState.babyName && !storage.readJson(STORAGE_KEYS.nameAsked, false)) openNameSheet();
else maybeShowMorningMoment();
registerOfflineSupport();
</script>
</body>

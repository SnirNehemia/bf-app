function buildMealDaysMarkup(statsByFood, nowMs) {
  const mealsByDay = new Map();
  for (let index = appState.meals.length - 1; index >= 0; index -= 1) {
    const meal = appState.meals[index];
    const dayStartMs = startOfLocalDay(meal.startMs);
    if (!mealsByDay.has(dayStartMs)) mealsByDay.set(dayStartMs, []);
    mealsByDay.get(dayStartMs).push(meal);
  }
  const allDays = [...mealsByDay.keys()];
  const shownDays = allDays.slice(0, appState.mealDaysShown);

  const daysMarkup = shownDays.map(dayStartMs => {
    const dayMeals = mealsByDay.get(dayStartMs);
    return `
      <section class="history-day">
        <div class="history-day__head">
          <h3 class="history-day__title">${formatDayHeading(dayStartMs, nowMs)}</h3>
          <p class="history-day__summary">${formatMealCount(dayMeals.length)}</p>
        </div>
        ${dayMeals.map(meal => buildMealEntryMarkup(meal, statsByFood)).join('')}
      </section>`;
  }).join('');

  const moreButton = allDays.length > shownDays.length
    ? `<button class="button button--secondary button--block more-history" type="button" data-action="meals-more">להציג ימים קודמים</button>`
    : '';
  return daysMarkup + moreButton;
}

function buildMealEntryMarkup(meal, statsByFood) {
  const foodsMarkup = meal.foods.map(foodName => {
    const isFirstTime = statsByFood.get(foodName) && statsByFood.get(foodName).firstMealId === meal.id;
    return `${escapeHtml(foodName)}${isFirstTime ? '<span class="new-badge">חדש</span>' : ''}`;
  }).join(', ');
  const metaParts = [];
  if (meal.amount) metaParts.push(MEAL_AMOUNTS[meal.amount]);
  if (meal.liking) metaParts.push(MEAL_LIKINGS[meal.liking].label);
  const liking = meal.liking ? MEAL_LIKINGS[meal.liking] : null;

  return `
    <button class="history-entry" type="button" data-action="edit-meal" data-meal-id="${meal.id}">
      <span class="history-entry__time">${formatClockTime(meal.startMs)}</span>
      <span>
        <span class="meal-foods">${foodsMarkup}</span>
        ${metaParts.length ? `<span class="meal-meta">${metaParts.join(', ')}</span>` : ''}
        ${meal.reaction ? `<span class="reaction-text">תגובה: ${escapeHtml(meal.reaction)}</span>` : ''}
      </span>
      <span class="liking-emoji" ${liking ? `aria-label="${liking.label}"` : 'aria-hidden="true"'}>${liking ? liking.emoji : ''}</span>
    </button>`;
}

function buildFoodChipMarkup({ label, foodToLog, tries, hadReaction }) {
  const triedClass = tries > 0 ? ' is-tried' : '';
  const countMarkup = tries > 0 ? `<span class="food-chip__count" dir="ltr">✓${tries}</span>` : '';
  const reactionMarkup = hadReaction ? '<span class="reaction-dot" aria-label="נרשמה תגובה"></span>' : '';
  return `<button class="food-chip${triedClass}" type="button" data-action="open-meal" data-food="${escapeHtml(foodToLog)}">${escapeHtml(label)}${countMarkup}${reactionMarkup}</button>`;
}

function buildFoodCollectionMarkup(statsByFood, statsByAllergen) {
  const groupMarkups = [];

  // Allergens: one chip per allergen, tried if any food containing it was eaten.
  const allergenChips = ALLERGENS.map(allergen => {
    const allergenStats = statsByAllergen.get(allergen.key);
    return buildFoodChipMarkup({
      label: allergen.label,
      foodToLog: allergen.food,
      tries: allergenStats ? allergenStats.tries : 0,
      hadReaction: Boolean(allergenStats && allergenStats.hadReaction),
    });
  }).join('');
  groupMarkups.push(buildFoodGroupMarkup('אלרגנים נפוצים', statsByAllergen.size, ALLERGENS.length, allergenChips));

  for (const group of FOOD_GROUPS) {
    if (group.id === 'allergens') continue;
    let triedInGroup = 0;
    const chips = group.foods.map(foodName => {
      const foodStats = statsByFood.get(foodName);
      if (foodStats) triedInGroup += 1;
      return buildFoodChipMarkup({
        label: foodName,
        foodToLog: foodName,
        tries: foodStats ? foodStats.tries : 0,
        hadReaction: Boolean(foodStats && foodStats.hadReaction),
      });
    }).join('');
    groupMarkups.push(buildFoodGroupMarkup(group.title, triedInGroup, group.foods.length, chips));
  }

  const customFoodNames = getCustomFoodNames(statsByFood);
  if (customFoodNames.length) {
    const chips = customFoodNames.map(foodName => {
      const foodStats = statsByFood.get(foodName);
      return buildFoodChipMarkup({ label: foodName, foodToLog: foodName, tries: foodStats.tries, hadReaction: foodStats.hadReaction });
    }).join('');
    groupMarkups.push(buildFoodGroupMarkup('עוד מאכלים', null, null, chips));
  }
  return groupMarkups.join('');
}

function buildFoodGroupMarkup(title, triedCount, totalCount, chipsMarkup) {
  const countMarkup = totalCount ? `<span class="food-group__count">${triedCount} מתוך ${totalCount}</span>` : '';
  return `
    <div class="food-group">
      <div class="food-group__head"><h3 class="food-group__title">${title}</h3>${countMarkup}</div>
      <div class="chip-row">${chipsMarkup}</div>
    </div>`;
}

function openMealSheet(existingMeal, preselectedFoodName = null) {

function getSelectedFoodsFromForm(form) {
  return [...form.querySelectorAll('[data-action="toggle-food"][aria-pressed="true"]')].map(chip => chip.dataset.food);
}

function addCustomFoodToForm(form) {
  const input = form.elements.customFood;
  const foodName = input.value.trim().replace(/\s+/g, ' ').slice(0, MAX_FOOD_NAME_LENGTH);
  if (!foodName) { input.focus(); return; }
  const existingChip = [...form.querySelectorAll('[data-action="toggle-food"]')].find(chip => chip.dataset.food === foodName);
  if (existingChip) {
    existingChip.setAttribute('aria-pressed', 'true');
  } else {
    form.querySelector('[data-custom-chips]').insertAdjacentHTML('beforeend', buildSelectableChipMarkup(foodName, true));
    form.querySelector('[data-custom-group]').hidden = false;
  }
  input.value = '';
  showFormError(form, '');
  updateAllergenNote(form);
}

/** "היום" / "אתמול" / "לפני 2 ימים" between two timestamps, by calendar day. */
function formatDaysBefore(earlierMs, laterMs) {
  const days = Math.round((startOfLocalDay(laterMs) - startOfLocalDay(earlierMs)) / MS_PER_DAY);
  if (days <= 0) return 'היום';
  if (days === 1) return 'אתמול';
  return `לפני ${days} ימים`;
}

/**
 * Gentle note when this meal introduces a new allergen shortly after another one,
 * or more than one new allergen at once (it makes a reaction harder to trace).
 */
function updateAllergenNote(form) {
  const noteElement = form.querySelector('[data-allergen-note]');
  const mealId = form.dataset.mealId || null;
  const mealTimeMs = fromDateTimeInputValue(form.elements.startLocal.value) || Date.now();
  const { statsByAllergen } = computeFoodStats(appState.meals, { excludeMealId: mealId });

  const newAllergenKeys = [...new Set(getSelectedFoodsFromForm(form)
    .map(food => FOOD_TO_ALLERGEN[food])
    .filter(allergenKey => allergenKey && !statsByAllergen.has(allergenKey)))];
  const labelFor = allergenKey => ALLERGENS.find(allergen => allergen.key === allergenKey).label;

  let noteText = '';
  if (newAllergenKeys.length > 1) {
    noteText = `בארוחה הזו יש ${newAllergenKeys.length} אלרגנים חדשים (${newAllergenKeys.map(labelFor).join(', ')}). אם תהיה תגובה, יהיה קשה לדעת מה גרם לה.`;
  } else if (newAllergenKeys.length === 1) {
    let latestIntroduction = null;
    for (const [allergenKey, allergenStats] of statsByAllergen) {
      const isRecent = allergenStats.firstMs <= mealTimeMs && mealTimeMs - allergenStats.firstMs < NEW_ALLERGEN_SPACING_MS;
      if (isRecent && (!latestIntroduction || allergenStats.firstMs > latestIntroduction.firstMs)) {
        latestIntroduction = { allergenKey, firstMs: allergenStats.firstMs };
      }
    }
    if (latestIntroduction) {
      noteText = `${labelFor(newAllergenKeys[0])} חדש, ו${labelFor(latestIntroduction.allergenKey)} נוסף לראשונה ${formatDaysBefore(latestIntroduction.firstMs, mealTimeMs)}. נוח לחכות כמה ימים בין אלרגנים חדשים, כדי לדעת מה גרם לתגובה אם תהיה.`;
    }
  }
  noteElement.textContent = noteText;
  noteElement.hidden = !noteText;
}

function handleMealFormSubmit(form) {
  const originalMeal = form.dataset.mealId ? findMealById(form.dataset.mealId) : null;
  // A typed food that was not yet added with the button still counts.
  if (form.elements.customFood.value.trim()) addCustomFoodToForm(form);

  const foods = getSelectedFoodsFromForm(form);
  const startMs = readStartTimeFromForm(form, originalMeal);
  const checkedAmount = form.querySelector('input[name="amount"]:checked');
  const checkedLiking = form.querySelector('input[name="liking"]:checked');
  const reaction = form.elements.reaction.value.trim().slice(0, MAX_REACTION_NOTE_LENGTH);

  if (foods.length === 0) return showFormError(form, 'צריך לבחור לפחות מאכל אחד.');
  if (!Number.isFinite(startMs)) return showFormError(form, 'צריך לבחור מתי.');
  if (startMs > Date.now() + 2 * MS_PER_MINUTE) return showFormError(form, 'השעה שנבחרה עוד לא הגיעה.');

  const meal = {
    id: originalMeal ? originalMeal.id : createEntryId(),
    startMs,
    foods,
    amount: checkedAmount ? checkedAmount.value : null,
    liking: checkedLiking ? checkedLiking.value : null,
    reaction: reaction || null,
  };
  const existingIndex = appState.meals.findIndex(existing => existing.id === meal.id);
  if (existingIndex >= 0) appState.meals[existingIndex] = meal;
  else appState.meals.push(meal);
  saveMeals();
  requestPersistentStorageOnce();
  closeSheet();
  renderAll();
  showToast(originalMeal ? 'השינויים נשמרו' : 'הארוחה נשמרה');
  // Wait for the sheet to finish closing before a surprise appears.
  window.setTimeout(maybeShowFoodMoment, 350);
}


/* =====================================================================
 * 16d. MOMENTS — small surprises
 *  - Morning after a night with feeds: "כל הכבוד, צלחת עוד לילה" (once per morning).
 *  - Tap the title 5 times: hearts and "אנחנו אוהבים אותך".
 *  - Feeding between 01:00 and 05:00: a warm line under the timer.
 *  - Sometimes the "saved" message ends with something sweet.
 *  - Breastfeed milestones (50, 100, 200 …), first solid food, foods-tried milestones, all allergens.
 * ===================================================================== */

function pickRandom(items) {
  return items[Math.floor(Math.random() * items.length)];
}

/** Same pick for the whole day, so the line does not change on every redraw. */
function pickForToday(items) {
  const dayNumber = Math.floor(startOfLocalDay(Date.now()) / MS_PER_DAY);
  return items[dayNumber % items.length];
}

function hasSeenMoment(momentKey) {
  return Boolean(storage.readJson(STORAGE_KEYS.momentsSeen, {})[momentKey]);
}

function markMomentSeen(momentKey) {
  const momentsSeen = storage.readJson(STORAGE_KEYS.momentsSeen, {});
  momentsSeen[momentKey] = Date.now();
  storage.writeJson(STORAGE_KEYS.momentsSeen, momentsSeen);
}

/** Shows the moment card; returns false if another one is already open. */
function showMoment({ art, title, text, withHearts = false, buttonLabel = 'תודה 💛' }) {
  if (!elements.moment.hidden) return false;
  hideChartTooltip();
  elements.momentArt.textContent = art;
  elements.momentTitle.textContent = title;
  elements.momentText.textContent = text;
  elements.momentButton.textContent = buttonLabel;
  elements.moment.hidden = false;
  elements.momentButton.focus({ preventScroll: true });
  if (withHearts) releaseHearts();
  return true;
}

function closeMoment() {
  elements.moment.hidden = true;
}

function releaseHearts(heartCount = 18) {
  try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (error) { /* ignore */ }
  for (let index = 0; index < heartCount; index += 1) {
    const heart = document.createElement('span');
    heart.textContent = '♥';
    heart.style.left = `${4 + Math.random() * 88}%`;
    heart.style.fontSize = `${18 + Math.random() * 20}px`;
    heart.style.animationDelay = `${Math.random() * 1.1}s`;
    heart.style.setProperty('--drift', `${Math.round(-50 + Math.random() * 100)}px`);
    elements.hearts.appendChild(heart);
    window.setTimeout(() => heart.remove(), 5000);
  }
}

/** Five quick taps on the title. */
let recentTitleTapTimes = [];
function handleTitleTap() {
  const nowMs = Date.now();
  recentTitleTapTimes = recentTitleTapTimes.filter(tapMs => nowMs - tapMs < TITLE_TAP_WINDOW_MS);
  recentTitleTapTimes.push(nowMs);
  if (recentTitleTapTimes.length < TITLE_TAPS_FOR_LOVE) return;
  recentTitleTapTimes = [];
  haptic();
  showMoment({ art: '💛', title: 'אנחנו אוהבים אותך', text: `${babyLabel()} ואבא`, withHearts: true, buttonLabel: 'גם אני אתכם' });
}

/** Line under the timer for feeds in the small hours. */
function buildNightNoteMarkup() {
  const hour = new Date().getHours();
  return hour >= 1 && hour < 5 ? `<p class="night-note">${escapeHtml(pickForToday(NIGHT_NOTES()))}</p>` : '';
}

/** Morning (05:00–11:00) after a night with at least one feed: once per morning. */
function maybeShowMorningMoment() {
  const nowMs = Date.now();
  const hour = new Date(nowMs).getHours();
  if (hour < 5 || hour >= 11 || appState.activeSession) return false;
  const momentKey = `morning-${formatDateStamp(nowMs)}`;
  if (hasSeenMoment(momentKey)) return false;

  const todayStartMs = startOfLocalDay(nowMs);
  const yesterdayStartMs = addLocalDays(todayStartMs, -1);
  const nightStartMs = new Date(yesterdayStartMs).setHours(NIGHT_START_HOUR, 0, 0, 0);
  const nightEndMs = new Date(todayStartMs).setHours(NIGHT_END_HOUR, 0, 0, 0);
  const nightFeedCount = appState.entries.filter(entry => entry.startMs >= nightStartMs && entry.startMs < nightEndMs).length;
  if (nightFeedCount === 0) return false;

  const countSentence = nightFeedCount === 1 ? 'הייתה האכלה אחת בלילה.' : `היו ${nightFeedCount} האכלות בלילה.`;
  const shown = showMoment({
    art: '☀️',
    title: 'כל הכבוד, צלחת עוד לילה',
    text: `${countSentence} ${pickRandom(MORNING_ENDINGS())}`,
    buttonLabel: 'בוקר טוב',
  });
  if (shown) markMomentSeen(momentKey);
  return shown;
}

function maybeShowBreastfeedMilestone() {
  const breastfeedCount = appState.entries.filter(entry => entry.type === 'breast').length;
  if (!BREASTFEED_MILESTONES.includes(breastfeedCount)) return false;
  const momentKey = `breastfeeds-${breastfeedCount}`;
  if (hasSeenMoment(momentKey)) return false;
  const text = breastfeedCount === 100
    ? `מאה פעמים ש${babyLabel()} קיבלה ממך את הכי טוב שיש. אנחנו אוהבים אותך.`
    : `${breastfeedCount} הנקות, וכל אחת מהן בשביל ${babyLabel()}. אנחנו אוהבים אותך.`;
  const shown = showMoment({ art: '🏅', title: `הנקה מספר ${breastfeedCount}`, text, withHearts: true });
  if (shown) markMomentSeen(momentKey);
  return shown;
}

/** First solid food ever, foods-tried milestones, and all allergens introduced. */
function maybeShowFoodMoment() {
  const { statsByFood, statsByAllergen } = computeFoodStats(appState.meals);
  const candidates = [];
  if (appState.meals.length > 0) {
    candidates.push({ key: 'food-first', art: '🥄', title: 'הביס הראשון!', text: `${babyLabel()} התחילה לאכול. איזה רגע.`, withHearts: true });
  }
  for (const milestone of FOODS_TRIED_MILESTONES) {
    if (statsByFood.size >= milestone) {
      candidates.push({ key: `foods-${milestone}`, art: '🥕', title: `${milestone} מאכלים!`, text: `${babyLabel()} כבר טעמה ${milestone} מאכלים שונים. כל הכבוד לכן.` });
    }
  }
  if (statsByAllergen.size === ALLERGENS.length) {
    candidates.push({ key: 'allergens-all', art: '🌟', title: 'כל האלרגנים הנפוצים', text: `${babyLabel()} טעמה את כל ${ALLERGENS.length} האלרגנים הנפוצים. עבודה יסודית!` });
  }
  // Only the newest unseen one; older milestones reached at the same time are marked as seen quietly.
  const unseen = candidates.filter(candidate => !hasSeenMoment(candidate.key));
  if (unseen.length === 0) return false;
  const newest = unseen[unseen.length - 1];
  const shown = showMoment(newest);
  if (shown) unseen.forEach(candidate => markMomentSeen(candidate.key));
  return shown;
}

/* =====================================================================
 * 16. TOAST
 * ===================================================================== */

let toastTimeoutId = null;
let toastActionHandler = null;

function showToast(message, { actionLabel = null, onAction = null, durationMs = 3200 } = {}) {
  elements.toastMessage.textContent = message;
  elements.toastAction.hidden = !actionLabel;
  elements.toastAction.textContent = actionLabel || '';
  toastActionHandler = onAction;
  elements.toast.hidden = false;
  window.clearTimeout(toastTimeoutId);
  toastTimeoutId = window.setTimeout(hideToast, durationMs);
}

function hideToast() {
  elements.toast.hidden = true;
  toastActionHandler = null;
}


/* =====================================================================
 * 17. EVENT WIRING
 * ===================================================================== */

document.addEventListener('click', event => {
  const actionElement = event.target.closest('[data-action]');
  if (!actionElement) return;
  const action = actionElement.dataset.action;

  switch (action) {
    case 'dial': {
      const side = actionElement.dataset.side;
      if (appState.activeSession) switchOrResumeOnSide(side);
      else startFeeding(side);
      break;
    }
    case 'resume-last': resumeLastSavedFeeding(); break;
    case 'pause': pauseFeeding(); break;
    case 'resume': resumeFeeding(); break;
    case 'finish': finishFeeding(); break;
    case 'discard': discardActiveFeeding(); break;

    case 'go-tab':
      appState.currentTab = actionElement.dataset.tab;
      hideChartTooltip();
      renderAll();
      window.scrollTo(0, 0);
      break;

    case 'history-more':
      appState.historyDaysShown += HISTORY_DAYS_PAGE_SIZE;
      renderHistoryScreen();
      break;

    case 'set-range':
      appState.insightsRangeDays = Number(actionElement.dataset.days);
      storage.writeJson(STORAGE_KEYS.insightsRangeDays, appState.insightsRangeDays);
      renderInsightsScreen();
      break;

    case 'open-bottle': openBottleSheet(null); break;
    case 'open-manual-add': openBreastfeedSheet(null); break;
    case 'open-backup': openBackupSheet(); break;
    case 'close-sheet': closeSheet(); break;

    case 'edit-entry': {
      const entry = findEntryById(actionElement.dataset.entryId);
      if (!entry) break;
      if (entry.type === 'bottle') openBottleSheet(entry);
      else openBreastfeedSheet(entry);
      break;
    }

    case 'delete-entry': {
      const entry = findEntryById(actionElement.dataset.entryId);
      if (!entry) break;
      const question = entry.type === 'bottle' ? 'למחוק את הבקבוק הזה?' : 'למחוק את ההנקה הזו?';
      if (!window.confirm(question)) break;
      deleteEntry(entry.id);
      closeSheet();
      renderAll();
      showToast('הרישום נמחק');
      break;
    }

    case 'step': {
      const input = actionElement.closest('form').elements[actionElement.dataset.target];
      const maximum = Number(input.max) || 999;
      input.value = clampInteger(Number(input.value || 0) + Number(actionElement.dataset.delta), 0, maximum);
      input.dispatchEvent(new Event('input', { bubbles: true }));
      break;
    }

    case 'set-volume': {
      const input = actionElement.closest('form').elements.volumeMl;
      input.value = actionElement.dataset.value;
      break;
    }

    case 'title-tap': handleTitleTap(); break;
    case 'close-moment': closeMoment(); break;

    case 'open-meal': openMealSheet(null, actionElement.dataset.food || null); break;
    case 'meals-more':
      appState.mealDaysShown += MEAL_DAYS_PAGE_SIZE;
      renderFoodScreen();
      break;
    case 'toggle-food': {
      const isPressed = actionElement.getAttribute('aria-pressed') === 'true';
      actionElement.setAttribute('aria-pressed', String(!isPressed));
      const form = actionElement.closest('form');
      showFormError(form, '');
      updateAllergenNote(form);
      break;
    }
    case 'add-custom-food': addCustomFoodToForm(actionElement.closest('form')); break;
    case 'edit-meal': {
      const meal = findMealById(actionElement.dataset.mealId);
      if (meal) openMealSheet(meal);
      break;
    }
    case 'delete-meal': {
      if (!window.confirm('למחוק את הארוחה הזו?')) break;
      appState.meals = appState.meals.filter(meal => meal.id !== actionElement.dataset.mealId);
      saveMeals();
      closeSheet();
      renderAll();
      showToast('הארוחה נמחקה');
      break;
    }

    case 'export-json': exportBackupJson(); break;
    case 'export-csv': exportCsv(); break;
    case 'import-backup': elements.importFileInput.click(); break;
    case 'clear-all': clearAllData(); break;
    default: break;
  }
});

// Forms inside the sheet.
document.addEventListener('submit', event => {
  const form = event.target;
  event.preventDefault();
  if (form.dataset.form === 'breastfeed') handleBreastfeedFormSubmit(form);
  if (form.dataset.form === 'bottle') handleBottleFormSubmit(form);
  if (form.dataset.form === 'meal') handleMealFormSubmit(form);
  if (form.dataset.form === 'name') handleNameFormSubmit(form);
});

// Show "which side did it start on" only when both sides have minutes.
document.addEventListener('input', event => {
  const mealForm = event.target.closest && event.target.closest('form[data-form="meal"]');
  if (mealForm && event.target.name === 'startLocal') updateAllergenNote(mealForm);
  const form = event.target.closest && event.target.closest('form[data-form="breastfeed"]');
  if (!form) return;
  const bothSidesUsed = Number(form.elements.minutesR.value) > 0 && Number(form.elements.minutesL.value) > 0;
  form.querySelector('[data-first-side-field]').hidden = !bothSidesUsed;
  showFormError(form, '');
});

document.addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.name === 'customFood') {
    event.preventDefault();
    addCustomFoodToForm(event.target.closest('form'));
  }
  if (event.key === 'Escape' && !elements.moment.hidden) closeMoment();
});
elements.moment.addEventListener('click', event => {
  if (event.target === elements.moment) closeMoment();
});

// Tapping the dim area around a sheet closes it.
elements.sheet.addEventListener('click', event => {
  if (event.target === elements.sheet) closeSheet();
});
elements.sheet.addEventListener('cancel', event => {
  event.preventDefault();
  closeSheet();
});
window.addEventListener('popstate', () => {
  if (elements.sheet.open) elements.sheet.close();
});

elements.importFileInput.addEventListener('change', () => {
  const chosenFile = elements.importFileInput.files && elements.importFileInput.files[0];
  elements.importFileInput.value = '';
  if (chosenFile) importBackupFile(chosenFile);
});

elements.toastAction.addEventListener('click', () => {
  const handler = toastActionHandler;
  hideToast();
  if (handler) handler();
});

// Chart tooltips: tap a mark to see its details; tap anywhere else to hide.
document.addEventListener('pointerdown', event => {
  const tipTarget = event.target.closest && event.target.closest('.chart [data-tip]');
  if (tipTarget) showChartTooltip(tipTarget.getAttribute('data-tip'), event.clientX, event.clientY);
  else hideChartTooltip();
});
window.addEventListener('scroll', hideChartTooltip, { passive: true });

// Redraw charts when the screen width changes (rotation).
let resizeTimeoutId = null;
window.addEventListener('resize', () => {
  window.clearTimeout(resizeTimeoutId);
  resizeTimeoutId = window.setTimeout(() => {
    if (appState.currentTab === 'insights') renderInsightsScreen();
  }, 200);
});

// Coming back to the page (phone unlocked, app switched): re-read storage and redraw.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  loadStateFromStorage();
  renderAll();
  maybeShowMorningMoment();
});

// Another tab of the same page changed the data.
window.addEventListener('storage', event => {
  if (event.key && !event.key.startsWith('feedingTracker.')) return;
  loadStateFromStorage();
  renderAll();
});

// Clock: timers every second; full redraw when the calendar day changes.
let renderedDayStartMs = startOfLocalDay(Date.now());
window.setInterval(() => {
  const todayStartMs = startOfLocalDay(Date.now());
  if (todayStartMs !== renderedDayStartMs) {
    renderedDayStartMs = todayStartMs;
    renderAll();
    return;
  }
  updateLiveValues();
}, 1000);


/* =====================================================================
 * 18. START
 * ===================================================================== */

/** Offline support when installed from a web address (does nothing for a file opened from the phone). */
function registerOfflineSupport() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(window.location.protocol)) return;
  navigator.serviceWorker.register('sw.js').catch(() => { /* the app still works online */ });
}

loadStateFromStorage();
renderAll();
if (!appState.babyName && !storage.readJson(STORAGE_KEYS.nameAsked, false)) openNameSheet();
else maybeShowMorningMoment();
registerOfflineSupport();
</script>
